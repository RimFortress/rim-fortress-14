- type: mathCurve
  id: TargetDistance
  curves:
  - preset: InvNormalize
    variables:
      saturation: [float: 1]

- type: mathCurve
  id: InvNormalize
  variables:
    saturation: [float: 1]
  curves:
  - !type:Normalize
    saturation: [var: saturation]
  - minus: [float: 1]
  - !type:Abs

# Utility AI

- type: mathCurve
  id: BaseUAIScore
  variables:
    skill: [float: 0]
    skillFactor: [float: 3]
    targetsCount: [float: 0]
    targetsSaturation: [float: 2]
    performersCount: [float: 0]
    importance: [float: 0.45]
  curves:
  - var: skill
  - div: [var: skillFactor]
  - add:
    - var: targetsCount
    - !type:Normalize
      saturation: [var: targetsSaturation]
    - pow: [float: 2]
    - div:
      - var: performersCount
      - minus:
        - float: 1
      - clamp:
          min: 1
          max: 10
    - mul: [var: importance]

- type: mathCurve
  id: UAIScoreNeeds
  variables:
    need: [float: 0]
    pow: [float: 2]
  curves:
  - var: need
  - minus: [float: 1]
  - !type:Abs # In case the power is odd
  - pow: [var: pow]

- type: mathCurve
  id: UAIScoreFarming
  variables:
    targetsCount: [float: 0]
    performersCount: [float: 0]
  curves:
  - preset: BaseUAIScore
    variables:
      skill:
      - !type:SkillLevel
        skill: Farming
      targetsCount: [var: targetsCount]
      performersCount: [var: performersCount]
      importance: [float: 0.50]

- type: mathCurve
  id: UAIScoreHealing
  variables:
    targetsCount: [float: 0]
    performersCount: [float: 0]
  curves:
  - preset: BaseUAIScore
    variables:
      skill:
      - !type:SkillLevel
        skill: Healing
      targetsCount: [var: targetsCount]
      performersCount: [var: performersCount]
      importance: [float: 0.55]

# How strong a fighter is, the user is the fighter: how much it can take before it is critical, times how much its blow deals,
# with what it has in the hands (a blow or a shot, the greater, and a firearm that has no ammunition is not counted, see
# CombatStatsSystem). A fighter of 100 health and 10 damage of a blow is 1 strong. A fighter that is down is not strong.
- type: mathCurve
  id: FighterPower
  curves:
  - !type:CombatStat
    stat: Blow
  - div: [float: 10]
  - add: [float: 1]
  - mul:
    - !type:MobHealth
    - div: [float: 100]

- type: conversationScript
  id: ThankForHealing
  parent: BaseDialog
  actors:
  - id: initiator
    reqsFor:
      responder:
      - !type:Opinion
        moreThan: 0
        hasEffects:
        - OpinionHealed
  - id: responder

- type: conversationScript

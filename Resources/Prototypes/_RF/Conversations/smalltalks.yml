- type: conversationScript
  id: BaseDialog
  abstract: true
  actors:
  - id: initiator
    reqsFor:
      responder:
      - !type:Opinion
        moreThan: -5
  - id: responder
    reqsFor:
      initiator:
      - !type:Opinion
        moreThan: -5
  effects:
    initiator:
    - !type:AddMood
      proto: MoodPleasantConversation
    - !type:AddOpinion
      actors:
      - responder
      proto: OpinionPoliteDialogue
    - !type:ChangeNeed
      need: Socialization
      random:
        min: 15
        max: 30
    responder:
    - !type:AddMood
      proto: MoodPleasantConversation
    - !type:AddOpinion
      actors:
      - initiator
      proto: OpinionPoliteDialogue
    - !type:ChangeNeed
      need: Socialization
      random:
        min: 15
        max: 30
  order:
    lines: 4

- type: conversationScript
  id: Smalltalk01
  parent: BaseDialog

- type: conversationScript
  id: Smalltalk02
  parent: BaseDialog
  order:
    lines: 6

- type: conversationScript
  id: GreetingCasual
  parent: BaseDialog

- type: conversationScript
  id: MorningGreeting
  actors:
  - id: initiator
    reqs:
    - !type:DayHour
      moreThan: 5
      lessThan: 10
    - !type:Mood
      moreThan: -5
    reqsFor:
      responder:
      - !type:Opinion
        moreThan: -5
  - id: responder
    reqs:
    - !type:Mood
      moreThan: -5
    reqsFor:
      initiator:
      - !type:Opinion
        moreThan: -5
  order:
    lines: 2

# Bad mood
- type: conversationScript
  id: SmalltalkRejected
  actors:
  - id: initiator
    reqs:
    - !type:Mood
      moreThan: -5
    reqsFor:
      responder:
      - !type:Opinion
        moreThan: -5
  - id: responder
    reqs:
    - !type:Mood
      lessThan: -15
  effects:
    initiator:
    - !type:AddMood
      proto: MoodUnpleasantConversation
    - !type:ChangeNeed
      need: Socialization
      random:
        min: 5
        max: 10
    responder:
    - !type:AddMood
      proto: MoodConversationIrritated
  order:
    lines: 2

- type: conversationScript
  id: SmalltalkIgnored
  parent: BaseDialog
  actors:
  - id: initiator
    reqs:
    - !type:Mood
      moreThan: -5
    reqsFor:
      responder:
      - !type:Opinion
        moreThan: -5
  - id: responder
    reqs:
    - !type:Mood
      lessThan: -25
  effects:
    initiator:
    - !type:AddMood
      proto: MoodUnpleasantConversation
    responder:
    - !type:AddMood
      proto: MoodConversationIrritated

- type: conversationScript
  id: SmalltalkRude
  parent: BaseDialog
  actors:
  - id: initiator
    reqs:
    - !type:Mood
      moreThan: -5
    reqsFor:
      responder:
      - !type:Opinion
        moreThan: -5
  - id: responder
    reqs:
    - !type:Mood
      lessThan: -30
  effects:
    initiator:
    - !type:AddMood
      proto: MoodRudeConversation
    - !type:AddOpinion
      actors:
      - responder
      proto: OpinionRudeDialogue
    responder:
    - !type:AddMood
      proto: MoodConversationIrritated

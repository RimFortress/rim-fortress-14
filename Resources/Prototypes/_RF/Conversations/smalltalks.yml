- type: conversationScript
  id: BaseDialog
  abstract: true
  actors:
  - id: initiator
    reqs:
    - !type:Mood
      moreThan: -5
    reqsFor:
      responder:
      - !type:Opinion
        moreThan: -5
  - id: responder
    reqs:
    - !type:Mood
      moreThan: -5
    reqsFor:
      initiator:
      - !type:Opinion
        moreThan: -5
  effects:
    initiator:
    - !type:AddMoodEffect
      proto: MoodPleasantConversation
    - !type:AddOpinionEffect
      actors:
      - respondent
      proto: OpinionPoliteDialogue
    - !type:ChangeNeedEffect
      need: Socialization
      amount: 10
    respondent:
    - !type:AddMoodEffect
      proto: MoodPleasantConversation
    - !type:AddOpinionEffect
      actors:
      - initiator
      proto: OpinionPoliteDialogue
    - !type:ChangeNeedEffect
      need: Socialization
      amount: 10

- type: conversationScript
  id: Smalltalk01
  parent: BaseDialog
  lines:
  - initiator: conversation-smalltalk01-line1-a
    responder: conversation-smalltalk01-line1-b
  - initiator: conversation-smalltalk01-line2-a
    responder: conversation-smalltalk01-line2-b

- type: conversationScript
  id: Smalltalk02
  parent: BaseDialog
  lines:
  - initiator: conversation-smalltalk02-line1-a
    responder: conversation-smalltalk02-line1-b
  - initiator: conversation-smalltalk02-line2-a
    responder: conversation-smalltalk02-line2-b
  - initiator: conversation-smalltalk02-line3-a
    responder: conversation-smalltalk02-line3-b

- type: conversationScript
  id: GreetingCasual
  parent: BaseDialog
  lines:
  - initiator: conversation-greeting-casual-hello
    responder: conversation-greeting-casual-response
  - initiator: conversation-greeting-casual-how-are-you
    responder: conversation-greeting-casual-im-fine

- type: conversationScript
  id: MorningGreeting
  actors:
  - id: initiator
    reqs:
    - !type:DayHour
      moreThan: 5
      lessThan: 10
    - !type:Mood
      moreThan: -5
    reqsFor:
      responder:
      - !type:Opinion
        moreThan: -5
  - id: responder
    reqs:
    - !type:Mood
      moreThan: -5
    reqsFor:
      initiator:
      - !type:Opinion
        moreThan: -5
  lines:
  - initiator: conversation-morning-greeting-initiator
    responder: conversation-morning-greeting-responder

# Bad mood
- type: conversationScript
  id: SmalltalkRejected
  actors:
  - id: initiator
    reqs:
    - !type:Mood
      moreThan: -5
    reqsFor:
      respondent:
      - !type:Opinion
        moreThan: -5
  - id: respondent
    reqs:
    - !type:Mood
      lessThan: -15
  effects:
    initiator:
    - !type:AddMoodEffect
      proto: MoodUnpleasantConversation
    - !type:ChangeNeedEffect
      need: Socialization
      amount: 3
    respondent:
    - !type:AddMoodEffect
      proto: MoodConversationIrritated
  lines:
  - initiator: conversation-smalltalkrejected-initiator-1
    respondent: conversation-smalltalkrejected-respondent-1

- type: conversationScript
  id: SmalltalkIgnored
  actors:
  - id: initiator
    reqs:
    - !type:Mood
      moreThan: -5
    reqsFor:
      respondent:
      - !type:Opinion
        moreThan: -5
  - id: respondent
    reqs:
    - !type:Mood
      lessThan: -25
  effects:
    initiator:
    - !type:AddMoodEffect
      proto: MoodUnpleasantConversation
    respondent:
    - !type:AddMoodEffect
      proto: MoodConversationIrritated
  lines:
  - initiator: conversation-smalltalkignored-initiator-1
    respondent: conversation-smalltalkignored-respondent-1
  - initiator: conversation-smalltalkignored-initiator-2
    respondent: conversation-smalltalkignored-respondent-2

- type: conversationScript
  id: SmalltalkRude
  actors:
  - id: initiator
    reqs:
    - !type:Mood
      moreThan: -5
    reqsFor:
      respondent:
      - !type:Opinion
        moreThan: -5
  - id: respondent
    reqs:
    - !type:Mood
      lessThan: -30
  effects:
    initiator:
    - !type:AddMoodEffect
      proto: MoodRudeConversation
    - !type:AddOpinionEffect
      actors:
      - respondent
      proto: OpinionRudeDialogue
    respondent:
    - !type:AddMoodEffect
      proto: MoodConversationIrritated
  lines:
  - initiator: conversation-smalltalkrude-initiator-1
    respondent: conversation-smalltalkrude-respondent-1
  - initiator: conversation-smalltalkrude-initiator-2
    respondent: conversation-smalltalkrude-respondent-2

# The conversations are the kinds of situations (see engagement.yml) with the Conversation component: the roles of the
# participants and the order in which they speak. The lines are in the localization by the id: conversation-id-line-N.
- type: dataset
  id: BasicConversations
  values:
  - Smalltalk01
  - Smalltalk02
  - GreetingCasual
  - MorningGreeting
  - SmalltalkRejected
  - SmalltalkIgnored
  - SmalltalkRude
  - ThankForHealing
  - CheckOnPatient

- type: entity
  id: BaseDialog
  parent: BaseEngagement
  abstract: true
  components:
  - type: Engagement
    roles:
    - BaseDialogInitiator
    - BaseDialogResponder
  - type: Conversation
    order:
      actors:
      - BaseDialogInitiator
      - BaseDialogResponder
      lines: 4

- type: entity
  id: Smalltalk01
  parent: BaseDialog

- type: entity
  id: Smalltalk02
  parent: BaseDialog
  components:
  - type: Conversation
    order:
      actors:
      - BaseDialogInitiator
      - BaseDialogResponder
      lines: 6

- type: entity
  id: GreetingCasual
  parent: BaseDialog

- type: entity
  id: MorningGreeting
  parent: BaseEngagement
  components:
  - type: Engagement
    roles:
    - MorningGreetingInitiator
    - MorningGreetingResponder
  - type: Conversation
    order:
      actors:
      - MorningGreetingInitiator
      - MorningGreetingResponder
      lines: 2


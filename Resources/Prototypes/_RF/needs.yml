- type: need
  id: Sleep
  thresholds:
    Overslept: 100
    Rested: 80
    Tired: 40
    Exhausted: 20
  thresholdDecayTime:
    Overslept: 2h
    Rested: 6h
    Tired: 3h
    Exhausted: 2h
  thresholdIcons:
    Overslept:
      sprite: /Textures/_RF/Interface/Misc/need_icons.rsi
      state: overslept
    Tired:
      sprite: /Textures/_RF/Interface/Misc/need_icons.rsi
      state: tired
    Exhausted:
      sprite: /Textures/_RF/Interface/Misc/need_icons.rsi
      state: exhausted
  roundstartRandomize:
    min: 70
    max: 85

- type: need
  id: Socialization
  thresholds:
    Overstimulated: 100
    Socialized: 80
    Lonely: 40
    Isolated: 20
  thresholdDecayTime:
    Overstimulated: 2h
    Socialized: 3h
    Lonely: 2h
    Isolated: 4h
  roundstartRandomize:
    min: 70
    max: 80

- type: need
  id: Sleep
  thresholds:
  - id: Overslept
    value: 100
    decayTime: 2h
    icon:
      sprite: /Textures/_RF/Interface/Misc/need_icons.rsi
      state: overslept
    description: sleep-threshold-overslept
  - id: Rested
    value: 80
    decayTime: 11h
    description: sleep-threshold-rested
  - id: Tired
    value: 40
    decayTime: 5h
    icon:
      sprite: /Textures/_RF/Interface/Misc/need_icons.rsi
      state: tired
    description: sleep-threshold-tired
  - id: Exhausted
    value: 20
    decayTime: 4h
    icon:
      sprite: /Textures/_RF/Interface/Misc/need_icons.rsi
      state: exhausted
    description: sleep-threshold-exhausted
  roundstartRandomize:
    min: 70
    max: 85

- type: need
  id: Socialization
  thresholds:

    value: 100
    decayTime: 2h
  - id: Socialized
    value: 80
    decayTime: 4h
  - id: Lonely
    value: 40
    decayTime: 2h
  - id: Isolated
    value: 20
    decayTime: 4h
  roundstartRandomize:
    min: 70
    max: 80

- type: utilityQuery
  id: Self
  query:
  - !type:SelfQuery

- type: utilityQuery
  id: Bed
  query:
  - !type:OwnedQuery
  considerations:
  - !type:BedHealingCon
    curve: !type:NormCurve
  - !type:NormTargetDistanceCon
    curve: !type:PresetCurve
      preset: TargetDistance

# For idle compound

- type: utilityQuery
  id: Food
  query:
  - !type:OwnedQuery
  - !type:RfComponentFilter
    components:
    - type: Edible
    invert: true
  - !type:InHandsFilter
  considerations:
  - !type:TargetIsAliveCon
    curve: !type:InverseBoolCurve
  - !type:NormTargetDistanceCon
    curve: !type:PresetCurve
      preset: TargetDistance
  - !type:FoodValueCon
    curve: !type:QuadraticCurve
      slope: 1.0
      exponent: 0.4
  - !type:TargetAccessibleCon
    curve: !type:BoolCurve

- type: utilityQuery
  id: Drink
  query:
  - !type:OwnedQuery
  - !type:RfComponentFilter
    components:
    - type: Edible
    invert: true
  - !type:InHandsFilter
  considerations:
  - !type:TargetIsAliveCon
    curve: !type:InverseBoolCurve
  - !type:NormTargetDistanceCon
    curve: !type:PresetCurve
      preset: TargetDistance
  - !type:DrinkValueCon
    curve: !type:QuadraticCurve
      slope: 1.0
      exponent: 0.4
  - !type:TargetAccessibleCon
    curve: !type:BoolCurve

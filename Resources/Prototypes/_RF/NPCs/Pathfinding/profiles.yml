# Goes where it is possible to go and does not like lava and water. Nothing is impassable, a node that is blocked
# only costs a lot, so that the path through it is the last resort.
- type: pathProfile
  id: Walker
  # A path that would have to go through a body is not a path: the profile has no way to get through it, a rule with a goal
  # for that belongs to a profile of those who break and dig. Instead of walking up to the wall, the agent gives up at once.
  algorithm: !type:AStar
    maxCost: 5000
    allowPartial: false
  rules:
  - when:
    - !type:Blocked
    cost:
    - float: 10000
  # Bodies are gone around at a distance, the agent has a size and the path knows nothing of it.
  - when:
    - !type:TagInfluence
      tag: Obstacle
      moreThan: 0
    cost:
    - var: influence
    - mul:
      - float: 3
  # Where the agent does not fit between the bodies the path is not made, however close it is to the target.
  - when:
    - !type:TagInfluence
      tag: Obstacle
      moreThan: 0.55
    cost:
    - float: 10000
  - when:
    - !type:HasTag
      tag: Lava
    cost:
    - float: 100
  - when:
    - !type:HasTag
      tag: Water
    cost:
    - float: 5

# Picks a random place nearby for the agent to wander to, see PickAccessible.
- type: pathProfile
  id: Wander
  parent: Walker
  algorithm: !type:Bfs
    range: 7
    minRange: 2
    maxCost: 5000

# Goes where it is possible to go. How it is searched for is up to the query, see queries.yml. It does not go through lava, liquid plasma and chasms, or through what is blocked, and
# does not like water, ice and the tiles next to the lava.
- type: pathProfile
  id: Walker
  rules:
  # What is blocked is not gone through. What can be climbed onto is, unless the place is only to wander to: an agent that
  # is not going anywhere in particular does not climb the tables.
  - when:
    - !type:Blocked
    - !type:Or
      conditions:
      - !type:HasTag
        tag: Climbable
        invert: true
      - !type:Query
        id: Wander
    # The doors are gone through by their own rules, see below.
    - !type:HasTag
      tag: Door
      invert: true
    cost: [float: 10000]
  # The doors. A closed door that opens by itself is no trouble. The agent that only looks for a place to wander to does
  # not go through a door that has to be opened or pried, and nobody goes through a door that cannot be.
  - when:
    - !type:HasTag
      tag: DoorBlocked
    cost: [float: 10000]
  - when:
    - !type:HasTag
      tag: DoorNeedsOpening
    - !type:Query
      id: Wander
    cost: [float: 10000]
  - when:
    - !type:HasTag
      tag: DoorNeedsPry
    - !type:Query
      id: Wander
    cost: [float: 10000]
  # A door that has to be opened by hand: the agent stops short of it, opens it and goes on.
  - when:
    - !type:HasTag
      tag: DoorNeedsOpening
    - !type:Query
      id: Wander
      invert: true
    cost: [float: 4]
    goal:
      id: DoorOpen
      targetKey: DoorPoint
      rangeKey: InteractRange
      entityTag: Door
      entityKey: DoorTarget
  # A door that has to be pried is pried if the agent has something to pry it with.
  - when:
    - !type:HasTag
      tag: DoorNeedsPry
    - !type:Query
      id: Wander
      invert: true
    requires:
    - Query/Crowbar != null
    cost: [float: 8]
    goal:
      id: DoorPry
      targetKey: DoorPoint
      rangeKey: InteractRange
      entityTag: Door
      entityKey: DoorTarget
  - when:
    - !type:HasTag
      tag: DoorNeedsPry
    - !type:Query
      id: Wander
      invert: true
    requires:
    - Query/Crowbar == null
    cost: [float: 10000]
  # A door that stays open is closed after the agent has gone through, if the agent closes the doors and is not in the combat
  # mode: it is on an order then, and it does not stop for the doors.
  - when:
    - !type:HasTag
      tag: DoorCanClose
    - !type:Query
      id: Wander
      invert: true
    requires:
    - CloseDoors == true
    - CombatMode == false
    cost: [float: 1]
    goal:
      id: DoorClose
      when: After
      targetKey: DoorPoint
      rangeKey: InteractRange
      entityTag: Door
      entityKey: DoorTarget
  # A path that goes over what can be climbed onto has a goal at it: to climb.
  - when:
    - !type:HasTag
      tag: Climbable
    - !type:Blocked
    - !type:Query
      id: Wander
      invert: true
    requires:
    - Climbing == false
    cost: [float: 2]
    goal:
      id: Climb
      targetKey: ClimbTarget
      rangeKey: InteractRange
  # Bodies are gone around at a distance, the agent has a size and the path knows nothing of it.
  - when:
    - !type:TagInfluence
      tag: Obstacle
      moreThan: 0
    cost:
    - var: influence
    - mul: [float: 3]
  # Where the agent does not fit between the bodies the path is not made, however close it is to the target. What is
  # climbed onto is on the tile of the body itself, and it is not a place to avoid.
  - when:
    - !type:TagInfluence
      tag: Obstacle
      moreThan: 0.55
    - !type:HasTag
      tag: Climbable
      invert: true
    cost: [float: 10000]
  # What can be climbed onto is an obstacle like the others for the one that does not climb.
  - when:
    - !type:TagInfluence
      tag: Climbable
      moreThan: 0.55
    - !type:Query
      id: Wander
    cost: [float: 10000]
  # Where an agent burns or falls the path does not go, the cost is more than the profile allows. It does not go by the
  # edge of it either: the tiles work when the body is over them, and an agent has a size. A node is at the edge if the
  # influence of the tag is more than that, it is one on the tile itself.
  - when:
    - !type:TagInfluence
      tag: Lava
      moreThan: 0.7
    cost: [float: 10000]
  - when:
    - !type:TagInfluence
      tag: Chasm
      moreThan: 0.4
    cost: [float: 10000]
  - when:
    - !type:TagInfluence
      tag: LiquidPlasma
      moreThan: 0.4
    cost: [float: 10000]
  # The tiles next to the lava cost more, the closer to it the more: the heat is felt, and a step to the side is the end.
  - when:
    - !type:TagInfluence
      tag: Lava
      moreThan: 0
    cost:
    - var: influence
    - mul: [float: 4]
  - when:
    - !type:HasTag
      tag: Water
    cost: [float: 5]
  # To wander into the water is not worth it, it is only gone through when there is a reason.
  - when:
    - !type:HasTag
      tag: Water
    - !type:Query
      id: Wander
    cost: [float: 10000]
  # The ice is slippery, but it is not a reason to go far around.
  - when:
    - !type:HasTag
      tag: Ice
    cost: [float: 0.5]

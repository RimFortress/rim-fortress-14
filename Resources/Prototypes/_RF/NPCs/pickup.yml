- type: goapCompound
  id: Pickup
  tasks:
  - preconditions:
    - InContainer == false
    actions:
    - !type:EntityCoords
      targetKey: PickupTarget
    - !type:MoveTo
      rangeKey: InteractRange
    - !type:Pickup
      targetKey: PickupTarget
    - !type:MarkOwner
      targetKey: PickupTarget
    effects:
      TargetPickedUp: true

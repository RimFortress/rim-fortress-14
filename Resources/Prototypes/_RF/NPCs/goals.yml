- type: utilityAiGoal
  id: Sleep
  scoreCurves:
  - !type:NeedLevel
    need: Sleep
  - minus:
    - float: 1
  - pow:
    - float: 4
  tempKeys:
  - Bed
  - TargetSleepLevel
  goalState:
    Rested: true
    WokeUp: true
  fallbacks:
  - WakeUp

- type: utilityAiGoal
  id: WakeUp
  conditions:
  - !type:Or
    conditions:
    - !type:IsBuckled
    - !type:Sleeping
  goalState:
    WokeUp: true

- type: utilityAiGoal
  id: Idle
  scoreCurves:
  - float: 0.15
  goalState:
    Idle: true

- type: utilityAiGoal
  id: Eat
  scoreCurves:
  - float: 1
  - minus:
    - !type:HungerLevel
  - pow:
    - float: 2
  tempKeys:
  - PickupTarget
  goalState:
    FoodEaten: true

- type: utilityAiGoal
  id: Drink
  scoreCurves:
  - float: 1
  - minus:
    - !type:ThirstLevel
  - pow:
    - float: 2
  tempKeys:
  - PickupTarget
  goalState:
    DrinkDrunk: true

- type: utilityAiGoal
  id: MoveTo
  goalState:
    NearTargetPlace: true

- type: utilityAiGoal
  id: PickUp
  color: "#00D5FF"
  goalState:
    TargetPickedUp: true

- type: utilityAiGoal
  id: Construction
  color: "#FFFF00"
  scoreCurves:
  - !type:SkillLevel
    skill: Construction
  - div:
    - float: 3
  - add:
    - !type:SearchQueryCount
      query: ConstructionTarget
    - !type:Normalize
    - pow:
      - float: 2
    - div:
      - !type:GoalPerformers
        goal: Construction
      - clamp:
          min: 1
          max: 10
    - mul:
      - float: 0.35
  goalState:
    TargetConstructed: true

- type: utilityAiGoal
  id: Dig
  color: "#E36414"
  scoreCurves:
  - !type:SkillLevel
    skill: Mining
  - div:
    - float: 3
  - add:
    - !type:PassiveTargets
      goal: Dig
    - !type:Normalize
    - pow:
      - float: 2
    - div:
      - !type:GoalPerformers
        goal: Dig
      - clamp:
          min: 1
          max: 10
    - mul:
      - float: 0.35
  goalState:
    TargetDug: true

- type: utilityAiGoal
  id: TakeOwnership
  color: "#075967"
  scoreCurves:
  - float: 0.8
  goalState:
    TargetOwned: true

- type: htnCompound
  id: StartConversationCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:StartConversationOperator

- type: htnCompound
  id: ConversationCompound
  branches:
  - preconditions:
    - !type:InConversationPrecondition
    - !type:NextInConversationPrecondition
      invert: true
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:SetFloatOperator
        targetKey: Time
        amount: 1
    - !type:HTNPrimitiveTask
      operator: !type:WaitOperator
        key: Time

  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:ConversationCoordinatesOperator
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        rangeKey: InteractRange
        removeKeyOnFinish: false
    - !type:HTNPrimitiveTask
      operator: !type:FaceToCoordinates

    # Waiting until it is our turn to speak
    - !type:HTNPrimitiveTask
      operator: !type:WaitWhileOperator
        preconditions:
        - !type:NextInConversationPrecondition
          invert: true

    # Random waiting time to make the dialogue look more natural
    # and give the player time to read the lines
    - !type:HTNPrimitiveTask
      operator: !type:SetRandomFloatOperator
        targetKey: Wait
        minAmount: 2.5
        maxAmount: 4
    - !type:HTNPrimitiveTask
      operator: !type:WaitOperator
        key: Wait

    - !type:HTNPrimitiveTask
      operator: !type:GetConversationLineOperator
        key: Message
    - !type:HTNPrimitiveTask
      operator: !type:SayKeyOperator
        key: Message

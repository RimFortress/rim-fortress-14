- type: htnCompound
  id: ConverationCompound
  branches:
  - preconditions:
    - !type:InConversationPrecondition
      invert: true
    task:
    - !type:HTNPrimitiveTask
      operator: !type:StartConversationOperator
    - !type:HTNPrimitiveTask
      operator: !type:IssueTaskOperator
        task: ConverationOrder
        targetsKey: ConversationActors
        taskCoordinates: ConversationCoordinates

- type: htnCompound
  id: ConverationOrderCompound
  branches:
  # Waiting until it's our turn in the dialogue.
  - preconditions:
    - !type:InConversationPrecondition
    - !type:NextInConversationPrecondition
      invert: true
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:SetRandomFloatOperator
        targetKey: Wait
        minAmount: 0.25
        maxAmount: 1
    - !type:HTNPrimitiveTask
      operator: !type:WaitOperator
        key: Wait

  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        rangeKey: InteractRange
        removeKeyOnFinish: false
    - !type:HTNPrimitiveTask
      operator: !type:RotateToTargetOperator
        targetKey: TargetCoordinates

    - !type:HTNPrimitiveTask
      operator: !type:GetConversationLineOperator
        key: Message

    - !type:HTNPrimitiveTask
      operator: !type:SayKeyOperator
        key: Message

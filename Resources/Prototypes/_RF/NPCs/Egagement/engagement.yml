# The kinds of situations are the prototypes of entities that have the Engagement component: the roles, whether the situation is
# closed when a role has fewer than it needs, and how long the invitations wait. Any other component that a kind needs is here too.
- type: entity
  id: BaseEngagement
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: Engagement

# Healing

- type: entity
  id: Healing
  parent: BaseEngagement
  components:
  - type: Engagement
    roles:
    - Doctor
    - HealedFriened

# Raids

# All the raiders of a raid.
- type: entity
  id: RaidForce
  parent: BaseEngagement
  components:
  - type: Engagement
    roles:
    - Raider

# The squad of a raid: there are as many of them as the raiders need, see JoinEngagement. It is not over when it has no leader.
- type: entity
  id: RaidSquad
  parent: BaseEngagement
  components:
  - type: Engagement
    dissolveInvalid: false
    roles:
    - SquadLeader
    # Before the others: when a participant could take it, it takes the breacher, which only some can.
    - SquadBreacher
    - SquadAssault
    - SquadSupport
  # The numbers of the squad (its power, the ratio and the stance, see MeasureSquads) and the state that keeps what only the
  # squad has: the share of the targets that it is given, see AssignSquadTargets.
  - type: MathVariables
  - type: Goap
    rootTask: Empty
    enabled: false

# A raider is in the raid until it is dead, a raider that is down is still in it. The raid is over when it has none left.
- type: engagementRole
  id: Raider
  force: true
  stayConditions:
  - !type:MobState
    targetState: Dead
    invert: true

# A raid is split into squads, see PlanSquads. A squad has a leader, who goes where the raid goes, and the others, who stay with
# the leader and fight what they see. The roles of the others are chosen by the engagement system, in proportion to the weights:
# there are three of the assault for each one of the support. The assault stays close to the leader and the support keeps further
# off. When the leader is dead one of the others takes his place, see the Raid rule.
- type: engagementRole
  id: SquadLeader
  parent: Raider
  minCount: 1
  maxCount: 1
  weight: 0

- type: engagementRole
  id: SquadAssault
  parent: Raider
  minCount: 0
  weight: 3
  onStart:
    SquadFollowRange: 4.0

- type: engagementRole
  id: SquadSupport
  parent: Raider
  minCount: 0
  weight: 1
  onStart:
    SquadFollowRange: 9.0

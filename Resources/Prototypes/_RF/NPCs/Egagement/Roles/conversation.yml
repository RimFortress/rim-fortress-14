# ThankForHealing

- type: engagementRole
  id: ThankForHealingInitiator
  parent: BaseDialogRole
  initiatorOnly: true
  conditionsFor:
    BaseDialogResponder:
    - !type:Opinion
      targetKey: EngagementParticipant
      moreThan: -1
      hasEffects:
      - OpinionHealed


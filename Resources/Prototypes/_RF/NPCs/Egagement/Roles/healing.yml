- type: engagementRole
  id: Doctor
  initiatorOnly: true
  stayConditions:
  - !type:MobState
    targetState: Alive

# The one who is treated may be down, but not dead.
- type: engagementRole
  id: HealedFriened
  force: true
  stayConditions:
  - !type:MobState
    targetState: Dead
    invert: true
  conditionsFor:
    Doctor:
    - !type:IsFriend
      targetKey: EngagementParticipant
  effects:
  - !type:AddOpinion
    actors: [Doctor]
    proto: OpinionHealed

- type: dataset
  id: BasicConversationEngagements
  values:
  - BaseDialogEngagement
  - MorningGreeting
  - SmalltalkRejected
  - SmalltalkIgnored
  - SmalltalkRude
  - ThankForHealing
  - CheckOnPatient

- type: engagement
  id: BaseDialogEngagement
  roles:
  - id: initiator
    initiatorOnly: true
    conditionsFor:
      responder:
      - !type:Opinion
        targetKey: EngagementParticipant
        moreThan: -5
    onStart:
      InConversation: true
    onFinishRemove:
    - InConversation
  - id: responder
    conditionsFor:
      initiator:
      - !type:Opinion
        targetKey: EngagementParticipant
        moreThan: -5
    onStart:
      InConversation: true
    onFinishRemove:
    - InConversation
  effects:
    initiator:
    - !type:AddMood
      proto: MoodPleasantConversation
    - !type:AddOpinion
      actors:
      - responder
      proto: OpinionPoliteDialogue
    - !type:ChangeNeed
      need: Socialization
      random:
        min: 15
        max: 30
    responder:
    - !type:AddMood
      proto: MoodPleasantConversation
    - !type:AddOpinion
      actors:
      - initiator
      proto: OpinionPoliteDialogue
    - !type:ChangeNeed
      need: Socialization
      random:
        min: 15
        max: 30

- type: engagement
  id: MorningGreeting
  roles:
  - id: initiator
    initiatorOnly: true
    conditions:
    - !type:DayHour
      moreThan: 5
      lessThan: 10
    - !type:Mood
      moreThan: -5
    conditionsFor:
      responder:
      - !type:Opinion
        targetKey: EngagementParticipant
        moreThan: -5
    onStart:
      InConversation: true
    onFinishRemove:
    - InConversation
  - id: responder
    conditions:
    - !type:Mood
      moreThan: -5
    conditionsFor:
      initiator:
      - !type:Opinion
        targetKey: EngagementParticipant
        moreThan: -5
    onStart:
      InConversation: true
    onFinishRemove:
    - InConversation

- type: engagement
  id: SmalltalkRejected
  roles:
  - id: initiator
    initiatorOnly: true
    conditions:
    - !type:Mood
      moreThan: -5
    conditionsFor:
      responder:
      - !type:Opinion
        targetKey: EngagementParticipant
        moreThan: -5
    onStart:
      InConversation: true
    onFinishRemove:
    - InConversation
  - id: responder
    conditions:
    - !type:Mood
      lessThan: -15
    onStart:
      InConversation: true
    onFinishRemove:
    - InConversation
  effects:
    initiator:
    - !type:AddMood
      proto: MoodUnpleasantConversation
    - !type:ChangeNeed
      need: Socialization
      random:
        min: 5
        max: 10
    responder:
    - !type:AddMood
      proto: MoodConversationIrritated

- type: engagement
  id: SmalltalkIgnored
  roles:
  - id: initiator
    initiatorOnly: true
    conditions:
    - !type:Mood
      moreThan: -5
    conditionsFor:
      responder:
      - !type:Opinion
        targetKey: EngagementParticipant
        moreThan: -5
    onStart:
      InConversation: true
    onFinishRemove:
    - InConversation
  - id: responder
    conditions:
    - !type:Mood
      lessThan: -25
    onStart:
      InConversation: true
    onFinishRemove:
    - InConversation
  effects:
    initiator:
    - !type:AddMood
      proto: MoodUnpleasantConversation
    responder:
    - !type:AddMood
      proto: MoodConversationIrritated

- type: engagement
  id: SmalltalkRude
  roles:
  - id: initiator
    initiatorOnly: true
    conditions:
    - !type:Mood
      moreThan: -5
    conditionsFor:
      responder:
      - !type:Opinion
        targetKey: EngagementParticipant
        moreThan: -5
    onStart:
      InConversation: true
    onFinishRemove:
    - InConversation
  - id: responder
    conditions:
    - !type:Mood
      lessThan: -30
    onStart:
      InConversation: true
    onFinishRemove:
    - InConversation
  effects:
    initiator:
    - !type:AddMood
      proto: MoodRudeConversation
    - !type:AddOpinion
      actors:
      - responder
      proto: OpinionRudeDialogue
    responder:
    - !type:AddMood
      proto: MoodConversationIrritated

- type: engagement
  id: ThankForHealing
  roles:
  - id: initiator
    initiatorOnly: true
    conditionsFor:
      responder:
      - !type:Opinion
        targetKey: EngagementParticipant
        moreThan: -1
        hasEffects:
        - OpinionHealed
    onStart:
      InConversation: true
    onFinishRemove:
    - InConversation
  - id: responder
    onStart:
      InConversation: true
    onFinishRemove:
    - InConversation

- type: engagement
  id: CheckOnPatient
  roles:
  - id: initiator
    initiatorOnly: true
    onStart:
      InConversation: true
    onFinishRemove:
    - InConversation
  - id: responder
    conditionsFor:
      initiator:
      - !type:Opinion
        targetKey: EngagementParticipant
        moreThan: -1
        hasEffects:
        - OpinionHealed
    onStart:
      InConversation: true
    onFinishRemove:
    - InConversation

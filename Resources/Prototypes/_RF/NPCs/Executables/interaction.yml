- type: executableGoal
  id: Drop
  parent: BaseExecutableGoal
  goal: Drop
  verbIcon: _RF/Interface/VerbIcons/hand-solid.svg.192dpi.png
  selfPerform: true
  conditions:
  - !type:KeyEqual
    key1: Target
    key2: Owner

- type: executableGoal
  id: Interact
  parent: BaseExecutableGoal
  goal: Interact
  verbIcon: _RF/Interface/VerbIcons/hand-pointer-solid.svg.192dpi.png
  maxPerformers: 1
  targetWhitelist:
    requireAll: false
    components:
    - Strap
    - Door
    tags:
    - HandGatherable

- type: executableGoal
  id: InventoryStorage
  parent: BaseExecutableGoal
  goal: InventoryStorage
  verbIcon: _RF/Interface/VerbIcons/hand-solid.svg.192dpi.png
  targetWhitelist:
    components:
    - Item

- type: executableGoal
  id: PickUp
  parent: BaseExecutableGoal
  goal: PickUp
  verbIcon: _RF/Interface/VerbIcons/hand-solid.svg.192dpi.png
  targetKey: PickupTarget
  maxPerformers: 1
  targetWhitelist:
    components:
    - Item

- type: executableGoal
  id: Pry
  parent: BaseExecutableGoal
  goal: Pry
  verbIcon: _RF/Interface/VerbIcons/left-right-solid.svg.192dpi.png
  maxPerformers: 1
  targetWhitelist:
    components:
    - Door

- type: executableGoal
  id: TakeOwnership
  parent: BaseExecutableGoal
  goal: TakeOwnership
  verbIcon: _RF/Interface/VerbIcons/house-flag-solid-full.svg.192dpi.png
  targetKey: Query/TakeOwnershipTarget
  maxPerformers: 1
  conditions:
  - !type:HasSameOwner
    targetKey: Query/TakeOwnershipTarget
    invert: true
  goalType:
  - Verb
  - Passive
  targetWhitelist:
    components:
    - Item

- type: goapCompound
  id: Drink
  tasks:
  - preconditions:
    - !type:SearchQueryValid
      query: DrinkOpened
    action: !type:SearchQuery
      query: DrinkOpened
      targetKey: PickupTarget
    effects:
      DrinkFound: true
      DrinkOpened: true

  - preconditions:
    - !type:SearchQueryValid
      query: DrinkClosed
    action: !type:SearchQuery
      query: DrinkClosed
      targetKey: PickupTarget
    effects:
      DrinkFound: true
      DrinkOpened: false

  - preconditions:
    - DrinkFound == true
    - TargetPickedUp == true
    action: !type:InteractWith
      targetKey: PickupTarget
    effects:
      DrinkOpened: true

  - preconditions:
    - TargetPickedUp == true
    - DrinkOpened == true
    action: !type:InteractWith
      targetKey: PickupTarget
    effects:
      DrinkDrunk: true

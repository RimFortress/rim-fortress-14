- type: goapCompound
  id: Drink
  tasks:
  - preconditions:
    - !type:SearchQueryValid
      query: DrinkOpened
    action: !type:SearchQuery
      query: DrinkOpened
      targetKey: PickupTarget
    effects:
      DrinkFound: true
      DrinkOpened: true

  - preconditions:
    - !type:SearchQueryValid
      query: DrinkClosed
    action: !type:SearchQuery
      query: DrinkClosed
      targetKey: PickupTarget
    effects:
      DrinkFound: true
      DrinkOpened: false

  - preconditions:
    - InContainer == false
    - DrinkFound == true
    actions:
    - !type:EntityCoords
      targetKey: PickupTarget
    - !type:MoveTo
      rangeKey: InteractRange
    - !type:Pickup
      targetKey: PickupTarget
    effects:
      DrinkPickedUp: true

  - preconditions:
    - DrinkPickedUp == true
    action: !type:InteractWith
      targetKey: PickupTarget
    effects:
      DrinkOpened: true

  - preconditions:
    - DrinkPickedUp == true
    - DrinkOpened == true
    action: !type:InteractWith
      targetKey: PickupTarget
    effects:
      DrinkDrunk: true

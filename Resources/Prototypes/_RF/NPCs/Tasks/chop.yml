- type: npcTask
  id: Chop
  name: Chop down a tree
  parent: BaseNpcTask
  maxPerformers: 1
  overlayColor: "#A0522D"
  verbIcon: /Textures/_RF/Interface/VerbIcons/tree-solid.svg.192dpi.png
  compound: ChopCompound
  passive: true
  tempKeys:
  - PickUpTarget
  targetWhitelist:
    tags:
    - Tree
  finishPreconditions:
  - !type:EntityDeletedPrecondition
    key: Target

- type: htnCompound
  id: ChopCompound
  branches:
  - preconditions:
    - !type:ActiveHandEntityTagsPrecondition
      tags:
      - FireAxe
      - BotanyHatchet
      requireAll: false
      invert: true
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: Axe
        key: PickUpTarget
    - !type:HTNCompoundTask
      task: PickUpCompound

  - preconditions:
    - !type:ActiveHandEntityPrecondition
    - !type:ActiveHandEntityTagsPrecondition
      tags:
      - FireAxe
      - BotanyHatchet
      requireAll: false
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:TryOperator
        try: !type:HTNPrimitiveTask
          preconditions:
          - !type:ActiveHandComponentPrecondition
            components:
            - type: Wieldable
          - !type:WieldedPrecondition
            invert: true
          operator: !type:WieldOperator

    - !type:HTNPrimitiveTask
      operator: !type:EntityCoordinatesOperator
        targetKey: Target
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: true
        rangeKey: InteractRange
        removeKeyOnFinish: true

    # Chop down tree
    - !type:HTNPrimitiveTask
      operator: !type:MeleeOperator
        targetKey: Target

    - !type:HTNPrimitiveTask
      operator: !type:MarkOwnerInRangeOperator

- type: utilityQuery
  id: Axe
  query:
  - !type:OwnedQuery
  - !type:TagFilter
    tags:
    - FireAxe
    - BotanyHatchet
    requireAll: false
    invert: true
  - !type:InventoryFilter
  - !type:InHandsFilter
  considerations:
  - !type:NormTargetDistanceCon
    curve: !type:PresetCurve
      preset: TargetDistance

- type: npcTask
  id: StartConversation
  name: Conversation
  parent: BaseNpcTask
  overlayColor: "#D3D3D3"
  compound: StartConversationCompound
  targetsQuery: Self # Stub for the ability to use this task as a passive
  startPreconditions:
  - !type:NeedLevelPrecondition
    need: Socialization
    thresholdId: Socialized
    invert: true
  - !type:NeedLevelPrecondition
    need: Socialization
    thresholdId: Overstimulated
    invert: true
  finishPreconditions:
  - !type:HasComponentPrecondition
    components:
    - type: ConversationActor

- type: htnCompound
  id: StartConversationCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:StartConversationOperator

- type: npcTask
  id: Deconstruct
  name: Deconstruct
  parent: BaseConstructionTask
  overlayColor: "#945A1C"
  verbIcon: /Textures/_RF/Interface/VerbIcons/trowel-bricks-solid.svg.192dpi.png
  verbOnly: true
  compound: DeconstructionCompound
  passive: true
  startPreconditions:
  # We dont want deconstruct items for now
  - !type:HasComponentPrecondition
    targetKey: Target
    components:
    - type: Item
    invert: true
  - !type:DeconstructionPrecondition
    key: Target
  finishPreconditions:
  - !type:OrPrecondition
    preconditions:
    - !type:ConstructionFinishedPrecondition
      key: Target
    - !type:EntityDeletedPrecondition
      key: Target

- type: htnCompound
  id: DeconstructionCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:StartDeconstructionOperator
        targetKey: Target
    - !type:HTNCompoundTask
      task: BuildCompound

- type: npcTask
  id: Build
  name: Build
  parent: BaseConstructionTask
  overlayColor: "#FFFF00"
  verbIcon: /Textures/_RF/Interface/hammer-solid.svg.192dpi.png
  compound: BuildCompound
  targetsQuery: BuildTaskTarget
  startPreconditions:
  - !type:ConstructionFinishedPrecondition
    key: Target
    invert: true
  finishPreconditions:
  - !type:ConstructionFinishedPrecondition
    key: Target

- type: htnCompound
  id: BuildCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:ConstructionItemsOperator
        targetKey: Target
    - !type:HTNPrimitiveTask
      operator: !type:IterateEntitiesOperator
        targetKey: ConstructionItems
        resultKey: PickUpTarget
    - !type:HTNCompoundTask
      task: PickUpCompound

  - tasks:
    # Go to the construction target
    - !type:HTNPrimitiveTask
      operator: !type:EntityCoordinatesOperator
        targetKey: Target
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: true
        rangeKey: InteractRange
        removeKeyOnFinish: true
    - !type:HTNPrimitiveTask
      operator: !type:IterateEntitiesOperator
        targetKey: ConstructionItems
        resultKey: ConstructionItem
    - !type:HTNPrimitiveTask
      operator: !type:ConstructionInteractOperator
        targetKey: Target

# Queries
- type: utilityQuery
  id: BuildTaskTarget
  query:
  - !type:OwnedQuery
  - !type:RfComponentFilter
    components:
      - type: CommonConstructionGhost
        constructionProto: MeatSpike
      - type: Construction
        graph: FloorBananium
        node: BananiumFloor
    requireAll: false
    invert: true
  - !type:ConstructionFinishedFilter
  considerations:
  - !type:NormTargetDistanceCon
    curve: !type:PresetCurve
      preset: TargetDistance

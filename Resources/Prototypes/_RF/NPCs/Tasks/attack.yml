- type: npcTask
  id: Attack
  name: Attack
  parent: BaseNpcTask
  overlayColor: "#FF0000"
  verbIcon: /Textures/_RF/Interface/VerbIcons/skull-crossbones-solid.svg.192dpi.png
  verbOnly: true
  compound: AttackTargetCompound
  passive: true
  failAwaitTime: 100
  tempKeys:
  - Item
  targetWhitelist:
    components:
    - HTN
  startPreconditions:
  - !type:MobStatePrecondition
    targetKey: Target
    state: Alive
  - !type:IsFriendlyPrecondition
    targetKey: Target
    invert: true
  finishPreconditions:
  - !type:OrPrecondition
    preconditions:
    - !type:EntityDeletedPrecondition
      key: Target
    - !type:MobStatePrecondition
      targetKey: Target
      state: Alive
      invert: true
    - !type:MobStatePrecondition
      targetKey: Owner
      state: Alive
      invert: true
    - !type:IsFriendlyPrecondition
      targetKey: Target

- type: htnCompound
  id: AttackTargetCompound
  branches:
  # Unbuckle
  - preconditions:
    - !type:BuckledPrecondition
      isBuckled: true
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UnbuckleOperator

  # Unpull
  - preconditions:
    - !type:PulledPrecondition
      isPulled: true
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UnPullOperator

  # Leave the container
  - preconditions:
    - !type:InContainerPrecondition
      isInContainer: true
    tasks:
    - !type:HTNCompoundTask
      task: EscapeCompound

  - preconditions:
    - !type:ActiveHandEntityPrecondition
    - !type:ActiveHandComponentPrecondition
      components:
      - type: Gun
      - type: MeleeWeapon
        damage:
          types:
            Slash: 0
      invert: true
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:DropOperator

  - preconditions:
    - !type:ActiveHandFreePrecondition
    - !type:KeyNotExistsPrecondition
      key: Item
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: InventoryGuns
        key: Item

  - preconditions:
    - !type:ActiveHandFreePrecondition
    - !type:KeyNotExistsPrecondition
      key: Item
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: InventoryMelees
        key: Item

  - preconditions:
    - !type:ActiveHandComponentPrecondition
      components:
      - type: Gun
      - type: MeleeWeapon
        damage:
          types:
            Slash: 0
      invert: true
    - !type:ActiveHandFreePrecondition
    - !type:KeyExistsPrecondition
      key: Item
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:EquipOperator
        target: Item
    - !type:HTNPrimitiveTask
      operator: !type:RemoveKeyOperator
        key: Item

  - preconditions:
    - !type:OrPrecondition
      preconditions:
      - !type:ActiveHandComponentPrecondition
        components:
        - type: Wieldable
        - type: GunRequiresWield
      - !type:ActiveHandComponentPrecondition
        components:
        - type: Wieldable
        - type: IncreaseDamageOnWield
          damage:
            types:
              Blunt: 0
    - !type:WieldedPrecondition
      invert: true
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:WieldOperator

  # Insert the cartridge into the chamber, if necessary
  - preconditions:
    - !type:ActiveHandComponentPrecondition
      components:
      - type: ChamberMagazineAmmoProvider
    - !type:BoltClosedPrecondition
      invert: true
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:SwitchBoltClosedOperator

  # Drop the gun NOW!!! (if no ammo)
  - preconditions:
    - !type:ActiveHandComponentPrecondition
      components:
      - type: Gun
    - !type:ActiveHandEntityPrecondition
    - !type:GunAmmoPrecondition
      maxPercent: 0.001
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:DropOperator

  # Gun
  - preconditions:
    - !type:ActiveHandComponentPrecondition
      components:
      - type: Gun
    - !type:GunAmmoPrecondition
      minPercent: 0.001
    - !type:KeyExistsPrecondition
      key: Target
    tasks:
    # Move to the target
    - !type:HTNPrimitiveTask
      operator: !type:EntityCoordinatesOperator
        targetKey: Target
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: true
        stopOnLineOfSight: true
        rangeKey: MeleeRange
    - !type:HTNPrimitiveTask
      operator: !type:JukeOperator
        jukeType: Away
    # Attack with a gun
    - !type:HTNPrimitiveTask
      operator: !type:GunOperator
        targetKey: Target
        opaqueKey: true

  # Melee
  - preconditions:
    - !type:ActiveHandComponentPrecondition
      components:
      - type: Gun
      invert: true
    tasks:
    # Go to the target at melee distance
    - !type:HTNPrimitiveTask
      operator: !type:EntityCoordinatesOperator
        targetKey: Target
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: true
        rangeKey: MeleeRange

    - !type:HTNPrimitiveTask
      operator: !type:TryOperator
        try: !type:HTNPrimitiveTask
          preconditions:
          - !type:ActiveHandComponentPrecondition
            components:
            - type: IncreaseDamageOnWield
              damage:
                types:
                  Piercing: 0
            - type: Wieldable
          - !type:WieldedPrecondition
            invert: true
          operator: !type:WieldOperator

    # Attack in close combat
    - !type:HTNPrimitiveTask
      preconditions:
      - !type:KeyExistsPrecondition
        key: Target
      - !type:TargetInRangePrecondition
        targetKey: Target
        rangeKey: MeleeRange
      operator: !type:MeleeOperator
        targetKey: Target

# Queries
- type: utilityQuery
  id: InventoryMelees
  query:
  - !type:InventoryQuery
  - !type:ComponentFilter
    components:
    - type: MeleeWeapon
      damage:
        types:
          Slash: 0

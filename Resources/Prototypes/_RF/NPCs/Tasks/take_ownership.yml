- type: npcTask
  id: TakeOwnership
  name: Take ownership
  parent: BaseSoloPerformTask
  overlayColor: "#075967"
  verbIcon: /Textures/_RF/Interface/VerbIcons/house-flag-solid-full.svg.192dpi.png
  compound: TakeOwnershipCompound
  passive: true
  targetWhitelist:
    components:
    - Item
  startPreconditions:
  - !type:HasOwnerPrecondition
    targetKey: Target
    invert: true
  finishPreconditions:
  - !type:OrPrecondition
    preconditions:
    - !type:EntityDeletedPrecondition
      key: Target
    - !type:OwnedPrecondition
      targetKey: Target

- type: htnCompound
  id: TakeOwnershipCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:EntityCoordinatesOperator
        targetKey: Target
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        rangeKey: InteractRange
    - !type:HTNPrimitiveTask
      operator: !type:MarkOwnerOperator
        targetKey: Target

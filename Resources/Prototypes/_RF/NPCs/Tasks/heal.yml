- type: npcTask
  id: Heal
  name: Heal
  parent: BaseNpcTask
  overlayColor: "#16C934"
  verbIcon: /Textures/_RF/Interface/VerbIcons/hand-holding-medical-solid.svg.192dpi.png
  verbOnly: true
  selfPerform: true
  compound: HealCompound
  tempKeys:
  - PickUpTarget
  - DamageType
  - DamageContainer
  targetWhitelist:
    components:
    - Damageable
    - HTN
  startPreconditions:
  - !type:MobStatePrecondition
    targetKey: Target
    state: Dead
    invert: true
  - !type:OrPrecondition
    preconditions:
    - !type:BleedingPrecondition
      targetKey: Target
    - !type:TotalDamagePrecondition
      targetKey: Target
      moreThan: 5.0
  finishPreconditions:
  - !type:OrPrecondition
    preconditions:
    - !type:EntityDeletedPrecondition
      key: Target
    - !type:AndPrecondition
      preconditions:
      - !type:BleedingPrecondition
        targetKey: Target
        invert: true
      - !type:TotalDamagePrecondition
        targetKey: Target
        lessThan: 5.0
    # Doctor, we've lost him
    - !type:MobStatePrecondition
      targetKey: Target
      state: Dead

# Compounds
- type: htnCompound
  id: HealCompound
  branches:
  - preconditions:
    - !type:HasComponentPrecondition
      components:
      - type: ActiveDoAfter
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:SetFloatOperator
        targetKey: Time
        amount: 0.5
    - !type:HTNPrimitiveTask
      operator: !type:WaitOperator
        key: Time

  # Turns out stopping the bleeding is not a very
  # important part of the healing and it goes away on its own,
  # so I think we can remove it

  # Stop bleeding
  #- preconditions:
  #    - !type:KeyExistsPrecondition
  #      key: Target
  #    - !type:BleedingPrecondition
  #      targetKey: Target
  #  tasks:
  #    - !type:HTNCompoundTask
  #      task: StopBleedingCompound

  - preconditions:
    - !type:TargetBuckledPrecondition
      targetKey: Target
      invert: true
    tasks:
    - !type:HTNCompoundTask
      task: BuckleToBedCompound

  # Restore blood level
  - preconditions:
    - !type:KeyExistsPrecondition
      key: Target
    - !type:BloodLevelPrecondition
      targetKey: Target
      lessThan: 1.0
    tasks:
    - !type:HTNCompoundTask
      task: RestoreBloodLevelCompound

  # Heal
  - preconditions:
    - !type:KeyExistsPrecondition
      key: Target
    tasks:
    - !type:HTNCompoundTask
      task: BaseHealCompound

- type: htnCompound
  id: BaseHealCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:GetEntityDamageOperator
        targetKey: Target
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: TargetHeal
        key: PickUpTarget
    - !type:HTNCompoundTask
      task: PickUpCompound

    # Go to the target for healing
    - !type:HTNPrimitiveTask
      operator: !type:EntityCoordinatesOperator
        targetKey: Target
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: true
        rangeKey: InteractRange
        removeKeyOnFinish: true

    - !type:HTNPrimitiveTask
      operator: !type:TryOperator
        try: !type:HTNPrimitiveTask
          preconditions:
          - !type:ActiveHandEntityIsPrecondition
            targetKey: PickUpTarget
          operator: !type:InteractWithOperator
            targetKey: Target

- type: htnCompound
  id: StopBleedingCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: HeatMelee
        key: PickUpTarget
    - !type:HTNCompoundTask
      task: PickUpCompound

    - !type:HTNPrimitiveTask
      operator: !type:EntityCoordinatesOperator
        targetKey: Target
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: true
        rangeKey: InteractRange
        removeKeyOnFinish: true

    - !type:HTNPrimitiveTask
      preconditions:
      - !type:BleedingPrecondition
        targetKey: Target
      operator: !type:MeleeOperator
        targetKey: Target

- type: htnCompound
  id: RestoreBloodLevelCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: BloodLevelHeal
        key: PickUpTarget
    - !type:HTNCompoundTask
      task: PickUpCompound

    - !type:HTNPrimitiveTask
      operator: !type:EntityCoordinatesOperator
        targetKey: Target
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: true
        rangeKey: InteractRange
        removeKeyOnFinish: true

    - !type:HTNPrimitiveTask
      operator: !type:TryOperator
        try: !type:HTNPrimitiveTask
          preconditions:
          - !type:ActiveHandEntityIsPrecondition
            targetKey: PickUpTarget
          operator: !type:InteractWithOperator
            targetKey: Target

- type: htnCompound
  id: BuckleToBedCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: HealingBed
        key: BedTarget

    - !type:HTNPrimitiveTask
      operator: !type:EntityCoordinatesOperator
        targetKey: Target
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: true
        rangeKey: InteractRange
        removeKeyOnFinish: true

    - !type:HTNPrimitiveTask
      operator: !type:TryOperator
        try: !type:HTNPrimitiveTask
          preconditions:
          - !type:TargetInRangePrecondition
            targetKey: Target
            rangeKey: InteractRange
          operator: !type:PullOperator
            targetKey: Target

    - !type:HTNPrimitiveTask
      operator: !type:EntityCoordinatesOperator
        targetKey: BedTarget
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: true
        rangeKey: MoveToCloseRange
        removeKeyOnFinish: false

    - !type:HTNPrimitiveTask
      operator: !type:MovePulledOperator

    - !type:HTNPrimitiveTask
      operator: !type:BuckleOperator
        targetKey: Target
        buckleKey: BedTarget
    - !type:HTNPrimitiveTask
      operator: !type:UnPullPullingOperator

# Queries
- type: utilityQuery
  id: TargetHeal
  query:
  - !type:OwnedQuery
  - !type:HealingFilter
    invert: true
  - !type:InHandsFilter
  - !type:InHandsFilter
  considerations:
  - !type:NormTargetDistanceCon
    curve: !type:PresetCurve
      preset: TargetDistance

- type: utilityQuery
  id: BloodLevelHeal
  query:
  - !type:OwnedQuery
  - !type:BloodHealingFilter
    invert: true
  - !type:InHandsFilter
  - !type:InHandsFilter
  considerations:
  - !type:NormTargetDistanceCon
    curve: !type:PresetCurve
      preset: TargetDistance

- type: utilityQuery
  id: HeatMelee
  query:
  - !type:OwnedQuery
  - !type:MeleeDamageTypeFilter
    damageType: Heat
    invert: true
  - !type:InventoryFilter
  - !type:InHandsFilter
  considerations:
  - !type:NormTargetDistanceCon
    curve: !type:PresetCurve
      preset: TargetDistance

- type: utilityQuery
  id: HealingBed
  query:
  - !type:OwnedQuery
  considerations:
  - !type:BedHealingCon
    curve: !type:QuadraticCurve
      slope: 1.0
      exponent: 0.4
  - !type:NormTargetDistanceCon
    curve: !type:PresetCurve
      preset: TargetDistance

- type: npcTask
  id: Plant
  name: Plant
  parent: BaseFarmingTask
  compound: PlantingCompound
  targetsQuery: PlantTaskTarget
  startPreconditions:
  - !type:PlantHolderFilledPrecondition
    targetKey: Target
    invert: true
  finishPreconditions:
  - !type:PlantHolderFilledPrecondition
    targetKey: Target

- type: htnCompound
  id: PlantingCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: Seed
        key: PickUpTarget
    - !type:HTNCompoundTask
      task: PickUpCompound

    - !type:HTNPrimitiveTask
      operator: !type:EntityCoordinatesOperator
        targetKey: Target
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: true
        rangeKey: InteractRange
        removeKeyOnFinish: true

    - !type:HTNPrimitiveTask
      operator: !type:InteractWithOperator
        targetKey: Target

- type: utilityQuery
  id: PlantTaskTarget
  query:
  - !type:RangeComponentQuery
    components:
    - type: PlantHolder
  - !type:PlantHolderFilledFilter
  considerations:
  - !type:NormTargetDistanceCon
    curve: !type:PresetCurve
      preset: TargetDistance

- type: utilityQuery
  id: Seed
  query:
  - !type:OwnedQuery
  - !type:ComponentFilter
    components:
    - type: Seed
      seedId: wheat
  considerations:
  - !type:NormTargetDistanceCon
    curve: !type:PresetCurve
      preset: TargetDistance

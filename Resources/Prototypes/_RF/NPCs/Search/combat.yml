# Used by Gun action
- type: searchQuery
  id: InventoryMagazine
  query: !type:Inventory
  filters:
  - !type:KeyWhitelist
    targetKey: MagazineWhitelist
    passWhenNull: true
    invert: true
  - !type:KeyWhitelist
    targetKey: MagazineBlacklist
  considerations:
  - !type:Ammo
    curves:
    - !type:Quadratic

- type: searchQuery
  id: NearbyMagazine
  query: !type:Nearby
    range: 7
  filters:
  - !type:KeyWhitelist
    targetKey: MagazineWhitelist
    passWhenNull: true
    invert: true
  - !type:KeyWhitelist
    targetKey: MagazineBlacklist
  - !type:InInventory
  - !type:InHands
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance
  - !type:Ammo
    curves:
    - !type:Quadratic

- type: searchQuery
  id: AttackPassiveTarget
  query: !type:PassiveTargets
    goals:
    - Attack
  considerations:
  - !type:Damage
    curves:
    - !type:Normalize
    - mul:
      - !type:PassiveTargets
        goal: Attack
      - clamp:
          min: 1
          max: 10
      - !type:Normalize
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

- type: searchQuery
  id: InventoryGuns
  query: !type:Inventory
  filters:
  - !type:Component
    components:
    - type: Gun
    invert: true
  considerations:
  - !type:Ammo
    curves:
    - !type:Quadratic

- type: searchQuery
  id: NearbyGuns
  query: !type:Nearby
    range: 7
  filters:
  - !type:Component
    components:
    - type: Gun
    invert: true
  - !type:InInventory
  - !type:InHands
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance
  - !type:Ammo
    curves:
    - !type:Quadratic

- type: searchQuery
  id: InventoryMelees
  query: !type:Inventory
  filters:
  - !type:Component
    components:
    - type: MeleeWeapon
      damage:
        types:
          Slash: 0
    invert: true
  considerations:
  - !type:MeleeDamage
    curves:
    - !type:Normalize
    - !type:Quadratic

- type: searchQuery
  id: NearbyMelees
  query: !type:Nearby
    range: 7
  filters:
  - !type:Component
    components:
    - type: MeleeWeapon
      damage:
        types:
          Slash: 0
    invert: true
  - !type:InInventory
  - !type:InHands
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance
  - !type:MeleeDamage
    curves:
    - !type:Normalize
    - !type:Quadratic

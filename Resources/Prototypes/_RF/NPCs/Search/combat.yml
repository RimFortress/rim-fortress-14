# Used by Gun action
- type: searchQuery
  id: InventoryMagazine
  query: !type:Inventory
  filters:
  - !type:KeyWhitelist
    targetKey: MagazineWhitelist
    passWhenNull: true
  - !type:KeyWhitelist
    targetKey: MagazineBlacklist
    invert: true
  considerations:
  - !type:Ammo
    curves:
    - !type:Quadratic

- type: searchQuery
  id: NearbyMagazine
  parent: BaseItemQuery
  query: !type:Nearby
    range: 7
  filters:
  - !type:KeyWhitelist
    targetKey: MagazineWhitelist
    passWhenNull: true
  - !type:KeyWhitelist
    targetKey: MagazineBlacklist
    invert: true
  considerations:
  - !type:Ammo
    curves:
    - !type:Quadratic

- type: searchQuery
  id: AttackTarget
  query: !type:PassiveTargets
    goals:
    - Attack
  considerations:
  - !type:Damage
    curves:
    - !type:Normalize
    - mul:
      - !type:PassiveTargets
        goal: Attack
      - clamp:
          min: 1
          max: 10
      - !type:Normalize
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

- type: searchQuery
  id: InventoryGuns
  query: !type:Inventory
  filters:
  - !type:Component
    components:
    - type: Gun
  considerations:
  - !type:Ammo
    curves:
    - !type:Quadratic

- type: searchQuery
  id: NearbyGuns
  parent: BaseItemQuery
  query: !type:Nearby
    range: 7
  filters:
  - !type:Component
    components:
    - type: Gun
  considerations:
  - !type:Ammo
    curves:
    - !type:Quadratic

- type: searchQuery
  id: InventoryMelees
  query: !type:Inventory
  filters:
  - !type:Component
    components:
    - type: MeleeWeapon
      damage:
        types:
          Slash: 0
  considerations:
  - !type:MeleeDamage
    curves:
    - !type:Normalize
    - !type:Quadratic

- type: searchQuery
  id: NearbyMelees
  parent: BaseItemQuery
  query: !type:Nearby
    range: 7
  filters:
  - !type:Component
    components:
    - type: MeleeWeapon
      damage:
        types:
          Slash: 0
  considerations:
  - !type:MeleeDamage
    curves:
    - !type:Normalize
    - !type:Quadratic

# Whom an agent runs from, wherever they are: the ones that are hostile to it (by the factions) and the ones that have hit it just now, which
# it remembers as an opinion effect (see OpinionRecentlyAttacked). Nobody is a threat in general: it is the agent's own idea, so a raider
# is one for a resident and not for another raider.
- type: searchQuery
  id: Threats
  query: !type:Nearby
    whitelist:
      components:
      - MobState
    range: 20
  filters:
  - !type:IsAlive
  - !type:Or
    filters:
    - !type:IsHostile
    - !type:Opinion
      hasEffects:
      - OpinionRecentlyAttacked
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

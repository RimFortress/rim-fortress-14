- type: searchQuery
  id: Bed
  query: !type:Owned
  filters:
  - !type:Captured
  considerations:
  - !type:BuckleHealing
    curves:
    - !type:Normalize
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

- type: searchQuery
  id: Food
  query: !type:Owned
  filters:
  - !type:IsAlive
  - !type:InInventory
  - !type:InHands
  #- !type:Accessible
  #  invert: true
  - !type:Captured
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance
  - !type:Ingestion
    nutrition: true
    curves:
    - !type:Normalize
    - !type:Quadratic
      slope: 1
      exponent: 0.4

- type: searchQuery
  id: Drink
  query: !type:Owned
  filters:
  - !type:IsAlive
  - !type:InInventory
  - !type:InHands
  #- !type:Accessible
  #  invert: true
  - !type:Captured
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance
  - !type:Ingestion
    hydration: true
    curves:
    - !type:Normalize
    - !type:Quadratic
      slope: 1
      exponent: 0.4

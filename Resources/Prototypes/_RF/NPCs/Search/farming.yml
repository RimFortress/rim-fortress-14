- type: searchQuery
  id: Seed
  validTime: 0.5s
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: Seed
      seedId: wheat
    invert: true
  - !type:InInventory
  - !type:InHands
  - !type:Accessible
    invert: true
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

- type: searchQuery
  id: EmptyPlantHolder
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: PlantHolder
    invert: true
  - !type:PlantHolder
    filled: false
    invert: true
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

- type: searchQuery
  id: HarvestPlant
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: PlantHolder
    invert: true
  - !type:PlantHolder
    harvest: true
    dead: false
    needSharp: false
    invert: true
  considerations:
  - !type:SamePlantCount
    curves:
    - lessThan: 4
      value:
      - mul: [float: 0] # We don't harvest if we have fewer than 4 seeds left, so we don't run out
    - !type:Normalize
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

- type: searchQuery
  id: SamplePlant
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: PlantHolder
    invert: true
  - !type:PlantHolder
    harvest: true
    dead: false
    sampled: false
    invert: true
  considerations:
  - !type:SamePlantCount
    curves:
    - !type:Normalize
    - minus: [float: 1]
    - !type:Abs # More points for the plants that have the fewest
    - pow: [float: 2]
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

- type: searchQuery
  id: SharpHarvestPlant
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: PlantHolder
    invert: true
  - !type:PlantHolder
    harvest: true
    dead: false
    needSharp: true
    invert: true
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

- type: searchQuery
  id: DeadPlant
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: PlantHolder
    invert: true
  - !type:PlantHolder
    filled: true
    dead: true
    needSharp: false
    invert: true
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

- type: searchQuery
  id: SharpDeadPlant
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: PlantHolder
    invert: true
  - !type:PlantHolder
    filled: true
    dead: true
    needSharp: true
    invert: true
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

- type: searchQuery
  id: WeedPlantHolder
  query: !type:Owned
  considerations:
  - !type:Weed
    curves:
    - minus: [float: 0.40]
    - clamp:
        min: 0
        max: 1
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

- type: searchQuery
  id: WaterSource
  query: !type:Nearby
    whitelist:
      components:
      - DrainableSolution
    range: 15
  filters:
  - !type:DrainableSolution
    reagent: Water
    reagentMoreThan: 80.0
    invert: true
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

- type: searchQuery
  id: PlantWaterTarget
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: PlantHolder
    invert: true
  considerations:
  - !type:PlantHolderWater
    curves:
    - minus: [float: 1]
    - !type:Abs
    - minus: [float: 0.4]
    - clamp:
        min: 0
        max: 1
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

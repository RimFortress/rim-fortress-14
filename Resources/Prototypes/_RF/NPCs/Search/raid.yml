# The enemies of an agent that fights on its own, such as a raider, whoever they are and wherever they are.
- type: searchQuery
  id: HostileTarget
  query: !type:Nearby
    whitelist:
      components:
      - MobState
    range: 30
  filters:
  - !type:IsAlive
  - !type:IsHostile
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

# The residents of the settlement that the raid is for, as they were when it began. A raid is won when most of them are dead.
- type: searchQuery
  id: RaidTargets
  query: !type:KeyEntities
    key: Targets

# The residents that are down: dead, or in the critical state. A resident that is down is not a threat, and it is as good as beaten
# for the raid, which does not wait for it to bleed out.
- type: searchQuery
  id: RaidTargetsDown
  notify: true
  query: !type:KeyEntities
    key: Targets
  filters:
  - !type:IsAlive
    invert: true

# The living residents that the squad of a raider is given, the closest first: whom a raider goes to. The residents are shared
# between the squads by the raid, see AssignGroupTargets. The settlement itself is only a place, and it may be out of reach.
- type: searchQuery
  id: RaidObjective
  query: !type:KeyEntities
    key: Engagement/RaidSquad/State/Objective
  filters:
  - !type:IsAlive
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

# The residents that are alive: what the raid has to beat, how strong they are is the power of it.
- type: searchQuery
  id: RaidTargetsAlive
  query: !type:KeyEntities
    key: Targets
  filters:
  - !type:IsAlive

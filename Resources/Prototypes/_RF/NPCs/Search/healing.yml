- type: searchQuery
  id: HealingBuckleTarget
  parent: BasePullableQuery
  filters:
  - !type:IsFriendly
  - !type:IsCritical
  considerations:
  - !type:Damage
    curves:
    - !type:Normalize
      saturation: [float: 3]

# Bleeding

- type: searchQuery
  id: HeatMelees
  parent: BaseItemQuery
  considerations:
  - !type:MeleeDamage
    damageTypes:
    - Heat
    curves:
    - !type:Normalize
    - !type:Quadratic

- type: searchQuery
  id: BleedHealing
  parent: BaseItemQuery
  considerations:
  - !type:BleedHealing
    curves:
    - mul: [float: -1] # A negative value means healing
    - !type:Normalize
  - !type:StackCount
    curves:
    - lessThan: 0.001
      value: [float: 1] # This item is not a stack, which means it is not limited

- type: searchQuery
  id: BleedingFriend
  query: !type:Owned
  filters:
  - !type:IsFriendly
  - !type:Captured
    invert: true
  considerations:
  - !type:Bleed
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

# Blood level

- type: searchQuery
  id: LowBloodLevelFriend
  query: !type:Owned
  filters:
  - !type:IsFriendly
  - !type:Captured
    invert: true
  considerations:
  - !type:BloodLevel
    curves:
    - minus: [float: 1]
    - !type:Abs
    - lessThan: 0.15
      value: [float: 0]
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

- type: searchQuery
  id: BloodLevelHealing
  parent: BaseItemQuery
  considerations:
  - !type:BloodLevelHealing
    curves:
    - !type:Normalize
  - !type:StackCount
    curves:
    - lessThan: 0.001
      value: [float: 1]

# Damage heal

- type: searchQuery
  id: DamageHealTarget
  query: !type:Owned
  filters:
  - !type:IsFriendly
  - !type:Captured
    invert: true
  considerations:
  - !type:Damage
    damageContainers:
    - Biological
    curves:
    - !type:Normalize
      saturation: [float: 3]
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

# We can't just pick a random patient and a random treatment,
# nor can we look for a treatment for the largest type of damage,
# since there might not be a treatment for it;
# that's why we set treatment goals for each individual type of damage
# ... but is this really the best solution?

- type: searchQuery
  id: BaseHealingQuery
  parent: BaseItemQuery
  abstract: true
  considerations:
  - !type:StackCount
    curves:
    - lessThan: 0.001
      value: [float: 1]

- type: searchQuery
  id: BaseHealingTargetQuery
  abstract: true
  query: !type:Owned
  filters:
  - !type:IsFriendly
  - !type:Captured
    invert: true
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

# Do we need to heal Asphyxiation?


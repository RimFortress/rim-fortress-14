- type: searchQuery
  id: NotStoredItem
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: StockpileContent
    invert: true
  - !type:Component
    components:
    - type: Item
  - !type:StockpileStorage
  - !type:InInventory
    invert: true
  - !type:InHands
    invert: true
  #- !type:Accessible
  - !type:Captured
    invert: true
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

- type: searchQuery
  id: NotStoredCrate
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: StockpileContent
    invert: true
  - !type:Component
    components:
    - type: Pullable
    - type: EntityStorage
  - !type:StockpileStorage
  - !type:Pulled
    invert: true
  - !type:Captured
    invert: true
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance


- type: searchQuery
  id: StoredItem
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: StockpileContent
    - type: Item
  - !type:Captured
    invert: true
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

- type: searchQuery
  id: StoredCrate
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: StockpileContent
    - type: EntityStorage
  - !type:Captured
    invert: true
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance


- type: searchQuery
  id: OffsetStoredItem
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: StockpileContent
    - type: Item
  - !type:StockStoredOffset
    lessThan: 0.06
    invert: true
  - !type:InInventory
    invert: true
  - !type:InHands
    invert: true
  #- !type:Accessible
  - !type:Captured
    invert: true
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

- type: searchQuery
  id: OffsetStoredCrate
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: StockpileContent
    - type: EntityStorage
    - type: Pullable
  - !type:StockStoredOffset
    lessThan: 0.06
    invert: true
  - !type:Pulled
    invert: true
  - !type:Captured
    invert: true
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance


- type: searchQuery
  id: StoredItemToContainer
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: StockpileContent
    - type: Item
  - !type:StockpileStorage
    storedInContainer: true
    invert: true
  - !type:StockpileStorage
    moveToContainer: true
  - !type:InInventory
    invert: true
  - !type:InHands
    invert: true
  #- !type:Accessible
  - !type:Captured
    invert: true
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance


- type: searchQuery
  id: StoredItemSupply
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: StockpileContent
    - type: Item
  - !type:StockpileStorage
    supplyingOnly: true
  - !type:InInventory
    invert: true
  - !type:InHands
    invert: true
  #- !type:Accessible
  - !type:Captured
    invert: true
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

- type: searchQuery
  id: StoredCrateSupply
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: StockpileContent
    - type: EntityStorage
    - type: Pullable
  - !type:StockpileStorage
    supplyingOnly: true
  - !type:Pulled
    invert: true
  - !type:Captured
    invert: true
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance


- type: searchQuery
  id: StockpileToStore
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: Stockpile
  - !type:StockCanInsert
    targetKey: StoringTarget
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance
  # We give priority to stockpiles at the end of the supply chain.
  - !type:StockTotalSupplied
    curves:
    - !type:Normalize
    - minus: [float: 1]
    - !type:Abs

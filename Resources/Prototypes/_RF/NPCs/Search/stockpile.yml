- type: searchQuery
  id: NotStoredItem
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: StockpileContent
  - !type:Component
    components:
    - type: Item
    invert: true
  - !type:StockpileStorage
    invert: true
  - !type:InInventory
  - !type:InHands
  - !type:Accessible
    invert: true
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

- type: searchQuery
  id: NotStoredCrate
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: StockpileContent
  - !type:Component
    components:
    - type: Pullable
    - type: EntityStorage
    invert: true
  - !type:StockpileStorage
    invert: true
  - !type:Pulled
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance


- type: searchQuery
  id: StoredItem
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: StockpileContent
    - type: Item
    invert: true
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

- type: searchQuery
  id: StoredCrate
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: StockpileContent
    - type: EntityStorage
    invert: true
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance


- type: searchQuery
  id: OffsetStoredItem
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: StockpileContent
    - type: Item
    invert: true
  - !type:StockStoredOffset
    lessThan: 0.06
  - !type:InInventory
  - !type:InHands
  - !type:Accessible
    invert: true
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

- type: searchQuery
  id: OffsetStoredCrate
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: StockpileContent
    - type: EntityStorage
    - type: Pullable
    invert: true
  - !type:StockStoredOffset
    lessThan: 0.06
  - !type:Pulled
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance


- type: searchQuery
  id: StoredItemToContainer
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: StockpileContent
    - type: Item
    invert: true
  - !type:StockpileStorage
    storedInContainer: true
  - !type:StockpileStorage
    moveToContainer: true
    invert: true
  - !type:InInventory
  - !type:InHands
  - !type:Accessible
    invert: true
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance


- type: searchQuery
  id: StoredItemSupply
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: StockpileContent
    - type: Item
    invert: true
  - !type:StockpileStorage
    supplyingOnly: true
    invert: true
  - !type:InInventory
  - !type:InHands
  - !type:Accessible
    invert: true
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

- type: searchQuery
  id: StoredCrateSupply
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: StockpileContent
    - type: EntityStorage
    - type: Pullable
    invert: true
  - !type:StockpileStorage
    supplyingOnly: true
    invert: true
  - !type:Pulled
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance


- type: searchQuery
  id: StockpileToStore
  query: !type:Owned
  filters:
  - !type:StockCanInsert
    targetKey: StoringTarget
    invert: true
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance
  # We give priority to stockpiles at the end of the supply chain.
  - !type:StockTotalSupplied
    curves:
    - !type:Normalize
    - minus: [float: 1]
    - !type:Abs

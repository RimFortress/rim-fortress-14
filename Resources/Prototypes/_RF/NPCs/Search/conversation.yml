- type: searchQuery
  id: ConversationInviter
  query: !type:ConversationInvites
  filters:
  - !type:IsAlive
  - !type:Component
    components:
    - type: ConversationActor
    invert: true
  - !type:IsFriendly
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

- type: searchQuery
  id: ConversationTarget
  query: !type:Owned
  filters:
  - !type:Self
    invert: true
  - !type:IsAlive
  - !type:Component
    components:
    - type: ConversationActor
    invert: true
  - !type:IsFriendly
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

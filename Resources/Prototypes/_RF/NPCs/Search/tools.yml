- type: searchQuery
  id: Sharp
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: Sharp
    invert: true
  - !type:InInventory
  - !type:InHands
  #- !type:Accessible
  #  invert: true
  - !type:Captured
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance


- type: searchQuery
  id: Bucket
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: SolutionTransfer
    - type: Item
  - !type:DrainableSolution
    solutionMaxLessThan: 80.0
    invert: true
  - !type:Or
    filters:
    - !type:DrainableSolution
      solutionEmpty: true
    - !type:DrainableSolution
      reagent: Water
      onlyReagent: true
  - !type:InInventory
    invert: true
  - !type:InHands
    invert: true
  #- !type:Accessible
  - !type:Captured
    invert: true
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance


- type: searchQuery
  id: Sharp
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: Sharp
  - !type:Preset
    proto: Item
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

- type: searchQuery
  id: Hoe
  query: !type:Owned
  filters:
  - !type:HasTags
    tags:
    - Hoe
  - !type:Preset
    proto: Item
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

- type: searchQuery
  id: PlantSampleTaker
  query: !type:Owned
  filters:
  - !type:HasTags
    tags:
    - PlantSampleTaker
  - !type:Preset
    proto: Item
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

- type: searchQuery
  id: Bucket
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: SolutionTransfer
  - !type:Or
    filters:
    - !type:DrainableSolution
      solutionEmpty: true
    - !type:DrainableSolution
      reagent: Water
      onlyReagent: true
  - !type:Preset
    proto: Item
  considerations:
  - !type:DrainableSolutionMaxVolume
    curves:
    - !type:Normalize
      saturation: 3
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

- type: searchQuery
  id: Axe
  query: !type:Owned
  filters:
  - !type:HasTags
    tags:
    - FireAxe
    - BotanyHatchet
    requireAll: false
  - !type:Preset
    proto: Item
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

- type: searchQuery
  id: Pickaxe
  query: !type:Owned
  filters:
  - !type:HasTags
    tags:
    - Pickaxe
  - !type:Preset
    proto: Item
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

- type: searchQuery
  id: Crowbar
  query: !type:Owned
  filters:
  - !type:ToolQuality
    quality: Prying
  - !type:Preset
    proto: Item
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

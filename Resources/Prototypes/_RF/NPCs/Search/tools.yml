- type: searchQuery
  id: Bucket
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: SolutionTransfer
    - type: Item
    invert: true
  - !type:DrainableSolution
    solutionMaxLessThan: 80.0
  - !type:Or
    filters:
    - !type:DrainableSolution
      solutionEmpty: true
    - !type:DrainableSolution
      reagent: Water
      onlyReagent: true
    invert: true
  - !type:InInventory
  - !type:InHands
  #- !type:Accessible
  #  invert: true
  - !type:Captured
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance


- type: searchQuery
  id: Sharp
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: Sharp
  - !type:InInventory
    invert: true
  - !type:InHands
    invert: true
  #- !type:Accessible
  - !type:Captured
    invert: true
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance


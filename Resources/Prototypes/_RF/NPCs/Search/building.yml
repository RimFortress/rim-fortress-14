- type: searchQuery
  id: ConstructionTarget
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: CommonConstructionGhost
    - type: Construction
      graph: FloorBananium
      node: BananiumFloor
    requireAll: false
    invert: true
  - !type:Constructed
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

- type: searchQuery
  id: DeconstructPassiveTarget
  query: !type:PassiveTargets
    goals:
    - Deconstruct
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

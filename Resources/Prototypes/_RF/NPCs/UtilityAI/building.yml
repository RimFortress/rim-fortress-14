- type: utilityAiGoal
  id: Construction
  parent: BaseUtilityAiGoal
  color: "#FFFF00"
  scoreCurves:
  - preset: BaseUAIScore
    variables:
      skill:
      - !type:SkillLevel
        skill: Construction
      targetsCount:
      - !type:SearchQueryCount
        query: Construction
      performersCount:
      - !type:GoalPerformers
        goal: Construction
      importance: [float: 0.55]
  goalState:
    TargetConstructed: true

- type: utilityAiGoal
  id: Deconstruct
  color: "#945A1C"
  conditions:
  - CombatMode == false
  scoreCurves:
  # Not 1: the orders of the player have the best score there is and are not swapped for anything, the chores are.
  - float: 0.99
  goalState:
    TargetDeconstruct: true

- type: utilityAiGoal
  id: BaseFarmingGoal
  abstract: true
  color: "#1a9927"
  incumbentBonus:
  - mul: [float: 1.10]

- type: utilityAiGoal
  id: Plant
  parent: BaseFarmingGoal
  scoreCurves:
  - !type:SkillLevel
    skill: Farming
  - div: [float: 3]
  - add:
    - !type:SearchQueryCount
      query: EmptyPlantHolder
    - !type:Normalize
    - div:
      - !type:GoalPerformers
        goal: Plant
      - clamp:
          min: 1
          max: 10
    - mul: [float: 0.50]
  tempKeys:
  - Seed
  - EmptyPlantHolder
  goalState:
    SeedPlanted: true

- type: utilityAiGoal
  id: Harvest
  parent: BaseFarmingGoal
  scoreCurves:
  - !type:SkillLevel
    skill: Farming
  - div: [float: 3]
  - add:
    - !type:SearchQueryCount
      query: HarvestPlant
    - add:
      - !type:SearchQueryCount
        query: SharpHarvestPlant
    - !type:Normalize
    - pow: [float: 2]
    - div:
      - !type:GoalPerformers
        goal: Plant
      - clamp:
          min: 1
          max: 10
    - mul: [float: 0.50]
  tempKeys:
  - HarvestPlant
  - SharpTarget
  goalState:
    PlantHarvested: true

- type: utilityAiGoal
  id: RemoveWeed
  parent: BaseFarmingGoal
  scoreCurves:
  - !type:SkillLevel
    skill: Farming
  - div: [float: 3]

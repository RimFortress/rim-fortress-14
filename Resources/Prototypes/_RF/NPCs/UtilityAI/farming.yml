      query: WeedPlantHolder
    - !type:Normalize
    - div:
      - !type:GoalPerformers
        goal: RemoveWeed
      - clamp:
          min: 1
          max: 10
    - mul: [float: 0.50]
  tempKeys:
  - WeedPlantHolder
  - Hoe
  goalState:
    WeedRemoved: true

- type: utilityAiGoal
  id: SamplePlant
  parent: BaseFarmingGoal
  scoreCurves:

- type: utilityAiGoal
  id: Plant
  color: "#1a9927"
  conditions:
  - !type:Or
    conditions:
    - EmptyPlantHolder == null # This key is not null only when it is issued via ExecutableGoal
    - !type:PlantHolder
      targetKey: EmptyPlantHolder
      filled: false
  scoreCurves:
  - !type:SkillLevel
    skill: Farming
  - div: [float: 3]
  - add:
    - !type:SearchQueryCount
      query: EmptyPlantHolder
    - !type:Normalize
    - pow: [float: 2]
    - div:
      - !type:GoalPerformers
        goal: Plant
      - clamp:
          min: 1
          max: 10
    - mul: [float: 0.35]
  tempKeys:
  - Seed
  - EmptyPlantHolder
  goalState:
    SeedPlanted: true

- type: utilityAiGoal
  id: Harvest
  color: "#1A9927"
  conditions:
  - !type:Or
    conditions:
    - HarvestPlant == null
    - !type:PlantHolder
      targetKey: HarvestPlant
      harvest: true
  scoreCurves:
  - !type:SkillLevel
    skill: Farming
  - div: [float: 3]
  - add:
    - !type:SearchQueryCount
      query: HarvestPlant
    - add:
      - !type:SearchQueryCount
        query: SharpHarvestPlant
    - !type:Normalize
    - pow: [float: 2]
    - div:
      - !type:GoalPerformers
        goal: Plant
      - clamp:
          min: 1
          max: 10
    - mul: [float: 0.35]
  tempKeys:
  - HarvestPlant
  - SharpTarget
  goalState:
    PlantHarvested: true


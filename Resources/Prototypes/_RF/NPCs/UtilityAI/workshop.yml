- type: utilityAiGoal
  id: Cooking
  color: "#9D6280"
  scoreCurves:
  - preset: BaseUAIScore
    variables:
      skill:
      - !type:SkillLevel
        skill: Cooking
      targetsCount:
      - !type:WorkshopRecipesCount
        tables:
        - AllKitchenRecipesTable
      performersCount:
      - !type:GoalPerformers
        goal: Cooking
      importance: [float: 0.50]
  incumbentBonus:
  - preset: BaseUAIBonus
  goalState:
    Workshop: Kitchen
    CraftingFinished: true

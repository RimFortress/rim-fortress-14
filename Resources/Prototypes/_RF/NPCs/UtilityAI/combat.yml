- type: utilityAiGoal
  id: Attack
  parent: BaseUtilityAiGoal
  color: "#FF0000"
  conditions:
  - CombatMode == true
  - !type:Or
    conditions:
    - AttackTarget == null
    - !type:MobState
      targetKey: AttackTarget
      targetState: Dead
      invert: true
  scoreCurves:
  - float: 0.90
  capture:
  - Query/AttackTarget
  goalState:
    TargetAttacked: true

# A resident runs from whoever is out to hurt it: the entities that are hostile to it and the ones that have hit it just now (see the
# Threats query). The one that is ordered to fight (the combat mode) does not, and neither does the one that has been told what to do,
# the orders are more important (BaseExecutableGoal).
- type: utilityAiGoal
  id: Flee
  parent: BaseUtilityAiGoal
  color: "#FFDD00"
  conditions:
  - CombatMode == false
  - Query/Threats != null
  scoreCurves:
  - float: 0.95
  # Nowhere to run to is no reason to try again at once.
  failPolicy: Cooldown
  failCooldown: 3
  goalState:
    Fled: true

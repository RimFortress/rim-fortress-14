- type: utilityAiGoal
  id: Attack
  color: "#FF0000"
  conditions:
  - !type:Or
    conditions:
    - AttackTarget == null
    - !type:MobState
      targetKey: AttackTarget
      targetState: Dead
      invert: true
  scoreCurves:
  - float: 0.90
  capture:
  - Query/AttackTarget
  goalState:
    TargetAttacked: true

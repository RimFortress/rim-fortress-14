- type: utilityAiGoal
  id: AcceptConversationInvite
  parent: BaseUtilityAiGoal
  color: "#D3D3D3"
  conditions:
  - CombatMode == false
  - InConversation != true
  scoreCurves:
  - preset: UAIScoreNeeds
    variables:
      need:
      - !type:NeedLevel
        need: Socialization
  - add: [float: 0.01]
  # If not invites: x * 0
  - mul:
    - !type:EngagementInvites
      dataset: BasicConversations
    - clamp: {max: 1}
  - div:
    - !type:EngagementMembership
      dataset: BasicConversations
    - add: [float: 1]
    - pow: [float: 2]
  goalState:
    ConversationInviteAccepted: true

- type: utilityAiGoal
  id: StartConversation
  color: "#D3D3D3"
  parent: BaseUtilityAiGoal
  conditions:
  - CombatMode == false
  - InConversation != true
  failPolicy: Cooldown
  scoreCurves:
  - preset: UAIScoreNeeds
    variables:
      need:
      - !type:NeedLevel
        need: Socialization
  # The more invitations the agent has, the more it is for accepting them. How many conversations it is in does not count here: the
  # conversation it has started itself is one of them, and the goal would be worth less for it than before, and be given up for any
  # other, with the conversation torn down. The one that is in a conversation already does not start another, see the conditions.
  - div:
    - !type:EngagementInvites
      dataset: BasicConversations
    - add: [float: 1]
    - pow: [float: 2]
  goalState:
    ConversationFinished: true

- type: utilityAiGoal
  id: Conversation
  color: "#D3D3D3"
  conditions:
  - InConversation == true
  scoreCurves:
  - float: 1
  goalState:
    ConversationFinished: true

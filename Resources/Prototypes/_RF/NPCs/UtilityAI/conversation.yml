- type: utilityAiGoal
  id: AcceptConversationInvite
  color: "#D3D3D3"
  conditions:
  - InConversation == false
  scoreCurves:
  - preset: UAIScoreNeeds
    variables:
      need:
      - !type:NeedLevel
        need: Socialization
  - add: [float: 0.01]
  # If not invites: x * 0
  - mul:
    - !type:ConversationInvites
    - clamp: {max: 1}
  - div:
    - !type:ConversationInvites
      acceptedOnly: true
    - add: [float: 1]
    - pow: [float: 2]
  goalState:
    ConversationInviteAccepted: true

- type: utilityAiGoal
  id: StartConversation
  color: "#D3D3D3"
  failPolicy: Cooldown
  scoreCurves:
  - preset: UAIScoreNeeds
    variables:
      need:
      - !type:NeedLevel
        need: Socialization
  - div:
    - !type:ConversationInvites
      acceptedOnly: true
    - add: [float: 1]
    - pow: [float: 2]
  goalState:
    ConversationFinished: true

- type: utilityAiGoal
  id: Conversation
  color: "#D3D3D3"
  conditions:
  - InConversation == true
  scoreCurves:
  - float: 1
  goalState:
    ConversationFinished: true

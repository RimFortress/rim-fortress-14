- type: utilityAiGoal
  id: Sleep
  scoreCurves:
  - !type:NeedLevel
    need: Sleep
  - minus: [float: 1]
  - pow:
    - float: 4
  capture:
  - Query/Bed
  tempKeys:
  - TargetSleepLevel
  goalState:
    Rested: true
    WokeUp: true
  fallbacks:
  - WakeUp

- type: utilityAiGoal
  id: WakeUp
  conditions:
  - !type:Or
    conditions:
    - !type:IsBuckled
    - !type:Sleeping
  goalState:
    WokeUp: true

- type: utilityAiGoal
  id: Eat
  scoreCurves:
  - !type:HungerLevel
  - minus: [float: 1]
  - pow:
    - float: 2
  goalState:
    FoodEaten: true

- type: utilityAiGoal
  id: Drink
  scoreCurves:
  - !type:ThirstLevel
  - minus: [float: 1]
  - pow:
    - float: 2
  goalState:
    DrinkDrunk: true

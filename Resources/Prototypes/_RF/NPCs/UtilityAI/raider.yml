# A raider fights the enemies that it sees, and goes to the settlement it is sent to when there are none.
- type: utilityAiGoal
  id: RaiderAttack
  color: "#FF0000"
  scoreCurves:
  - float: 0.90
  incumbentBonus:
  - add: [float: 0.05]
  conditions:
  - Query/HostileTarget != null
  - Retreating == false
  capture:
  - Query/HostileTarget
  goalState:
    TargetAttacked: true

# A member of a squad stays with the leader of the squad, until it sees an enemy or has no leader.
- type: utilityAiGoal
  id: RaiderFollow
  color: "#FFCC44"
  scoreCurves:
  - float: 0.65
  conditions:
  - Engagement/RaidSquad/Role/SquadLeader != null
  - Engagement/RaidSquad/Role/SquadLeader/In == false
  - Retreating == false
  goalState:
    RaiderFollowed: true

# The closest of the residents that are alive: whom the raider goes to, until it sees an enemy.
- type: utilityAiGoal
  id: RaiderApproach
  color: "#FFAA00"
  scoreCurves:
  - float: 0.60
  conditions:
  - Query/RaidObjective != null
  - Retreating == false
  capture:
  - Query/RaidObjective
  goalState:
    RaiderApproached: true

# Where the settlement is, when there is nobody to go to.
- type: utilityAiGoal
  id: RaiderAdvance
  color: "#FF8800"
  scoreCurves:
  - float: 0.50
  conditions:
  - Query/RaidObjective == null
  - !type:KeyExist
    key: Engagement/Raid/Owner/SettlementTarget
  - Retreating == false
  goalState:
    RaiderAdvanced: true

# The raiders that have lost heart run away and do not fight.
- type: utilityAiGoal
  id: RaiderRetreat
  color: "#888888"
  scoreCurves:
  - float: 0.95
  conditions:
  - Retreating == true
  goalState:
    RaiderRetreated: true

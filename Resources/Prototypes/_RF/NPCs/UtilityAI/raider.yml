# A raider fights the enemies that it sees, and goes to the settlement it is sent to when there are none.
- type: utilityAiGoal
  id: RaiderAttack
  color: "#FF0000"
  scoreCurves:
  - float: 0.90
  incumbentBonus:
  - add: [float: 0.05]
  conditions:
  - Query/HostileTarget != null
  - Retreating == false
  capture:
  - Query/HostileTarget
  goalState:
    TargetAttacked: true

# The tactics of a squad depend on its stance (see MeasureSquads and the Raid rule: it is made of how strong the squad is against the
# residents) and on the role. In the stance 2, rush, the squad is much stronger: it does not keep together, the assault goes for the
# residents by itself, and only the support stays with the leader. In the stance 1 the squad stays together: all the members stay with
# the leader. In the stance 0, hold, the squad is too weak: it does not advance, the leader holds, and so do the members, until the
# squad is stronger or the raid loses heart. All of them fight what they see.
- type: utilityAiGoal
  id: RaiderFollow
  color: "#FFCC44"
  scoreCurves:
  - float: 0.65
  conditions:
  - Engagement/RaidSquad/Role/SquadLeader != null
  - Engagement/RaidSquad/Role/SquadLeader/In == false
  - Engagement/RaidSquad/Role/SquadBreacher/In == false
  - Engagement/RaidSquad/Var/stance > 0.5
  - Engagement/RaidSquad/Var/stance < 1.5
  - Retreating == false
  goalState:
    RaiderFollowed: true

- type: utilityAiGoal
  id: RaiderFollowSupport
  color: "#FFCC44"
  scoreCurves:
  - float: 0.65
  conditions:
  - Engagement/RaidSquad/Role/SquadSupport/In == true
  - Engagement/RaidSquad/Role/SquadLeader != null
  - Engagement/RaidSquad/Var/stance > 1.5
  - Retreating == false
  goalState:
    RaiderFollowed: true

- type: utilityAiGoal
  id: RaiderHold
  color: "#BBBB44"
  scoreCurves:
  - float: 0.7
  conditions:
  - Engagement/RaidSquad/Var/stance < 0.5
  - Retreating == false
  goalState:
    RaiderHeld: true

# The closest of the residents that are alive: whom the raider goes to, until it sees an enemy.
- type: utilityAiGoal
  id: RaiderApproach
  color: "#FFAA00"
  scoreCurves:
  - float: 0.60
  conditions:
  - Query/RaidObjective != null
  - Retreating == false
  capture:
  - Query/RaidObjective
  goalState:
    RaiderApproached: true

# Where the settlement is, when there is nobody to go to.
- type: utilityAiGoal
  id: RaiderAdvance
  color: "#FF8800"
  scoreCurves:
  - float: 0.50
  conditions:
  - Query/RaidObjective == null
  - !type:KeyExist
    key: Engagement/Raid/Owner/SettlementTarget
  - Retreating == false
  goalState:
    RaiderAdvanced: true

# The raiders that have lost heart run away and do not fight.
- type: utilityAiGoal
  id: RaiderRetreat
  color: "#888888"
  scoreCurves:
  - float: 0.95
  conditions:
  - Retreating == true
  goalState:
    RaiderRetreated: true

# A raider fights the enemies that it sees, and goes to the settlement it is sent to when there are none.
- type: utilityAiGoal
  id: RaiderAttack
  color: "#FF0000"
  scoreCurves:
  - float: 0.90
  incumbentBonus:
  - add: [float: 0.05]
  conditions:
  - Query/HostileTarget != null
  - Retreating == false
  capture:
  - Query/HostileTarget
  goalState:
    TargetAttacked: true

- type: utilityAiGoal
  id: RaiderAdvance
  color: "#FF8800"
  scoreCurves:
  - float: 0.50
  conditions:
  - !type:KeyExist
    key: SettlementTarget
  - Retreating == false
  goalState:
    RaiderAdvanced: true

# The raiders that have lost heart run away and do not fight.
- type: utilityAiGoal
  id: RaiderRetreat
  color: "#888888"
  scoreCurves:
  - float: 0.95
  conditions:
  - Retreating == true
  goalState:
    RaiderRetreated: true

- type: utilityAiGoal
  id: Storing
  color: "#A16C2B"
  scoreCurves:
  - preset: BaseUAIScore
    variables:
      targetsCount:
      - !type:SearchQueryCount
        query: NotStoredItem
      - add:
        - !type:SearchQueryCount
          query: NotStoredCrate
      - add:
        - !type:SearchQueryCount
          query: OffsetStoredItem
      - add:
        - !type:SearchQueryCount
          query: OffsetStoredCrate
      - add:
        - !type:SearchQueryCount
          query: StoredItemToContainer
      - add:
        - !type:SearchQueryCount
          query: StoredItemSupply
      - add:
        - !type:SearchQueryCount
          query: StoredCrateSupply
      performersCount:
      - !type:GoalPerformers
        goal: Storing
      importance: [float: 0.35]
  incumbentBonus:
  - preset: BaseUAIBonus
  goalState:
    TargetStored: true

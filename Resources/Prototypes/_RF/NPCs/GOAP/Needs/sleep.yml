- type: goapCompound
  id: Sleep
  tasks:
  - preconditions:
    - !type:SearchQueryValid
      query: Bed
    action: !type:SearchQuery
      query: Bed
      targetKey: Bed
    effects:
      BedFound: true

  - preconditions:
    - InContainer == false
    - Buckled == false
    - Pulled == false
    - BedFound == true
    actions:
    - !type:MoveTo
      rangeKey: InteractRange
    - !type:SwapToFreeHand
    - !type:InteractWith
      targetKey: Bed
    effects:
      ReadyForSleep: true

  - preconditions:
    - !type:SearchQueryValid
      query: Bed
      invert: true
    actions:
    - !type:PickAccessible
      rangeKey: IdleRange
    - !type:MoveTo
      findPath: false
    effects:
      ReadyForSleep: true

  - preconditions:
    - ReadyForSleep == true
    action: !type:Sleep
    effects:
      Sleeping: true

  - preconditions:
    - Sleeping == true
    actions:
    - !type:RandomFloat
      key: TargetSleepLevel
      min: 70
      max: 90
    - !type:WaitWhile
      conditions:
      - !type:NeedLevel
        need: Sleep
        maxKey: TargetSleepLevel
    effects:
      Rested: true

  - preconditions:
    - BedFound == true
    actions:
    - !type:WakeUp
    - !type:Unbuckle
    effects:
      WokeUp: true

  - preconditions:
    - BedFound == null
    actions:
    - !type:WakeUp
    - !type:AddMoodEffect
      effect: MoodSleptOnFloor
    effects:
      WokeUp: true

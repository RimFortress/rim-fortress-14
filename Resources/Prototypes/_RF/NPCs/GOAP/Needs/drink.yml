- type: goapCompound
  id: Drink
  tasks:
  - preconditions:
    - !type:ItemClosed
      targetKey: Query/Drink
      invert: true
    action: !type:CaptureQuery
      capture: Query/Drink
    effects:
      DrinkOpened: true

  - preconditions:
    - !type:ItemClosed
      targetKey: Query/Drink
    action: !type:CaptureQuery
      capture: Query/Drink
    effects:
      DrinkOpened: false

  - preconditions:
    - InContainer == false
    - Buckled == false
    - Pulled == false
    - Query/Drink != null
    actions:
    - !type:EntityCoords
      targetKey: Query/Drink
    - !type:MoveTo
      rangeKey: InteractRange
    - !type:Pickup
      targetKey: Query/Drink
    effects:
      DrinkPickedUp: true

  - preconditions:
    - DrinkPickedUp == true
    action: !type:InteractWith
      targetKey: Query/Drink
    effects:
      DrinkOpened: true

  - preconditions:
    - DrinkPickedUp == true
    - DrinkOpened == true
    action: !type:InteractWith
      targetKey: Query/Drink
    effects:
      DrinkDrunk: true

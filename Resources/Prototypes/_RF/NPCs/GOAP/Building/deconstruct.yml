- type: goapCompound
  id: Deconstruct
  tasks:
  - preconditions:
    - !type:SearchQueryValid
      query: DeconstructPassiveTarget
    action: !type:SearchQuery
      query: DeconstructPassiveTarget
      targetKey: DeconstructTarget
    effects:
      DeconstructTarget: true

  - preconditions:
    - DeconstructTarget != null
    action: !type:StartDeconstruction
      targetKey: DeconstructTarget
    effects:
      TargetDeconstruct: true

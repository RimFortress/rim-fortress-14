- type: goapCompound
  id: Construction
  tasks:
  - preconditions:
    - !type:SearchQueryValid
      query: ConstructionTarget
    action: !type:SearchQuery
      query: ConstructionTarget
      targetKey: ConstructionTarget
    effects:
      ConstructionTarget: true

  - preconditions:
    - InContainer == false
    - Buckled == false
    - Pulled == false
    - ConstructionTarget != null
    action: !type:Construction
      targetKey: ConstructionTarget
    effects:
      TargetConstructed: true

- type: searchQuery
  id: ConstructionTarget
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: CommonConstructionGhost
    - type: Construction
      graph: FloorBananium
      node: BananiumFloor
    requireAll: false
    invert: true
  - !type:Constructed
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

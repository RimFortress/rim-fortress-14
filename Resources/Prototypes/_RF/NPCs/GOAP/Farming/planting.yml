- type: goapCompound
  id: Planting
  tasks:
  - preconditions:
    - Query/Seed != null
    actions:
    - !type:EntityCoords
      targetKey: Query/Seed
    - !type:MoveTo
      rangeKey: InteractRange
    - !type:Pickup
      targetKey: Query/Seed
    effects:
      SeedPickedUp: true

  - preconditions:
    - Query/EmptyPlantHolder != null
    - SeedPickedUp == true
    actions:
    - !type:EntityCoords
      targetKey: Query/EmptyPlantHolder
    - !type:MoveTo
      rangeKey: InteractRange
    - !type:InteractWith
      targetKey: Query/EmptyPlantHolder
    effects:
      SeedPlanted: true

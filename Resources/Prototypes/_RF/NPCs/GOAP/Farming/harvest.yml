- type: goapCompound
  id: Harvest
  tasks:
  - preconditions:
    - ActiveHandFree == true
    - Query/HarvestPlant != null
    action: !type:CaptureQuery
      capture: Query/HarvestPlant
      targetKey: HarvestPlant
    effects:
      HarvestPlant: true
      NeedSharp: false

  - preconditions:
    - Query/SharpHarvestPlant != null
    action: !type:CaptureQuery
      capture: Query/SharpHarvestPlant
      targetKey: HarvestPlant
    effects:
      HarvestPlant: true
      NeedSharp: true

  - preconditions:
    - Query/Sharp != null
    actions:
    - !type:CaptureQuery
      capture: Query/Sharp
    - !type:MoveTo
      targetEntityKey: Query/Sharp
      rangeKey: InteractRange
    - !type:Pickup
      targetKey: Query/Sharp
    effects:
      NeedSharp: false

  - preconditions:
    - HarvestPlant != null
    - NeedSharp == false
    actions:
    - !type:MoveTo
      targetEntityKey: HarvestPlant
      rangeKey: InteractRange
    - !type:InteractWith
      targetKey: HarvestPlant
    - !type:MarkOwnerInRange
      whitelist:
        components:
        - Produce
    effects:
      PlantHarvested: true

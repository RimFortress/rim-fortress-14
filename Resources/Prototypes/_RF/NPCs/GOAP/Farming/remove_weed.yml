- type: goapCompound
  id: RemoveWeed
  tasks:
  - preconditions:
    - Query/Hoe != null
    actions:
    - !type:MoveTo
      targetEntityKey: Query/Hoe
      rangeKey: InteractRange
    - !type:Pickup
      targetKey: Query/Hoe
    effects:
      HoePickedUp: true

  - preconditions:
    - Query/WeedPlantHolder != null
    - HoePickedUp == true
    actions:
    - !type:MoveTo
      targetEntityKey: Query/WeedPlantHolder
      rangeKey: InteractRange
    - !type:InteractWith
      targetKey: Query/WeedPlantHolder
    effects:
      WeedRemoved: true

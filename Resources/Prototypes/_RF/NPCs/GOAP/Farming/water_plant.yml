- type: goapCompound
  id: WaterPlant
  tasks:
  - preconditions:
    - Query/Bucket != null
    actions:
    - !type:MoveTo
      targetEntityKey: Query/Bucket
      rangeKey: InteractRange
    - !type:Pickup
      targetKey: Query/Bucket
    effects:
      BucketPickedUp: true

  - preconditions:
    - BucketPickedUp == true
    - Query/WaterSource != null
    actions:
    - !type:MoveTo
      targetEntityKey: Query/WaterSource
      rangeKey: InteractRange
    - !type:InteractWith
      targetKey: Query/WaterSource
    effects:
      BuckedFilled: true

  - preconditions:
    - BuckedFilled == true
    - Query/PlantWaterTarget != null
    actions:
    - !type:MoveTo
      targetEntityKey: Query/PlantWaterTarget
      rangeKey: InteractRange
    - !type:InteractWith
      targetKey: Query/PlantWaterTarget
    effects:
      PlantWaterFilled: true

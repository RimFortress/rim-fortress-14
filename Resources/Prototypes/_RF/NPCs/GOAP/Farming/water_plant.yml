- type: goapCompound
  id: WaterPlant
  tasks:
  - preconditions:
    - !type:SearchQueryValid
      query: PlantWaterTarget
    action: !type:SearchQuery
      query: PlantWaterTarget
      targetKey: PlantWaterTarget
    effects:
      PlantWaterTarget: true

  - preconditions:
    - !type:SearchQueryValid
      query: Bucket
    action: !type:SearchQuery
      query: Bucket
      targetKey: Bucket
    effects:
      Bucket: true

  - preconditions:
    - Bucket != null
    actions:
    - !type:EntityCoords
      targetKey: Bucket
    - !type:MoveTo
      rangeKey: InteractRange
    - !type:Pickup
      targetKey: Bucket
    effects:
      BucketPickedUp: true

  - preconditions:
    - BucketPickedUp == true
    - !type:SearchQueryValid
      query: WaterSource
    actions:
    - !type:SearchQuery
      query: WaterSource
      targetKey: WaterSource
    - !type:EntityCoords
      targetKey: WaterSource
    - !type:MoveTo
      rangeKey: InteractRange
    - !type:InteractWith
      targetKey: WaterSource
    effects:
      BackedFilled: true

  - preconditions:
    - BackedFilled == true
    - PlantWaterTarget != null
    actions:
    - !type:EntityCoords
      targetKey: PlantWaterTarget
    - !type:MoveTo
      rangeKey: InteractRange
    - !type:InteractWith
      targetKey: PlantWaterTarget
    effects:
      PlantWaterFilled: true

- type: goapCompound
  id: Utility
  tasks:
  - actions:
    - !type:Container
      resultKey: Container
    - !type:ContainerEscape
      targetKey: Container
    effects:
      InContainer: false

  - actions:
    - !type:UnPull
    effects:
      Pulled: false

  - actions:
    - !type:Unbuckle
    effects:
      Buckled: false

  - preconditions:
    - FreeHandsCount > 0
    action: !type:SwapToFreeHand
    effects:
      ActiveHandFree: true

  # The hand is freed by putting what is in it away: a backpack, a pocket, or, if there is nowhere, the floor.
  - action: !type:FreeHand
    effects:
      ActiveHandFree: true

  - action: !type:Drop
      costMultiplier: 2
    effects:
      ActiveHandFree: true

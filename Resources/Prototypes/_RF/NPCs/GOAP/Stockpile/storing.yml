- type: goapCompound
  id: Storing
  tasks:
  # Base
  - preconditions:
    - Query/NotStoredItem != null
    action: !type:CaptureQuery
      capture: Query/NotStoredItem
      targetKey: StoringTarget
    effects:
      StoringType: Item

  - preconditions:
    - Query/NotStoredCrate != null
    action: !type:CaptureQuery
      capture: Query/NotStoredCrate
      targetKey: StoringTarget
    effects:
      StoringType: Crate

  # Stored
  - preconditions:
    - Query/OffsetStoredItem||Query/StoredItemToContainer||Query/StoredItemSupply != null
    action: !type:CaptureQuery
      capture: Query/OffsetStoredItem||Query/StoredItemToContainer||Query/StoredItemSupply
      targetKey: StoringTarget
    effects:
      StoredRemoved: false
      StoringType: Item

  - preconditions:
    - Query/OffsetStoredCrate||Query/StoredCrateSupply != null
    action: !type:CaptureQuery
      capture: Query/OffsetStoredCrate||Query/StoredCrateSupply
      targetKey: StoringTarget
    effects:
      StoredRemoved: false
      StoringType: Crate


  - preconditions:
    - StoredRemoved == false
    action: !type:RemoveFromStock
      targetKey: StoringTarget
    effect:
      StoredRemoved: true

  - preconditions:
    - StoredRemoved != false
    - StoringType == Item
    actions:
    - !type:StoringItem
      targetKey: StoringTarget
    effects:
      TargetStored: true

  - preconditions:
    - StoredRemoved != false
    - StoringType == Crate
    actions:
    - !type:StoringCrate
      targetKey: StoringTarget
    effects:
      TargetStored: true

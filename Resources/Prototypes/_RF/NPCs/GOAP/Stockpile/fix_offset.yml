- type: goapCompound
  id: FixStoredOffset
  tasks:
  - preconditions:
    - !type:SearchQueryValid
      query: OffsetStoredItem
    actions:
    - !type:SearchQuery
      query: OffsetStoredItem
      targetKey: StoringTarget
    - !type:RemoveFromStock
      targetKey: StoringTarget
    effects:
      StoringOffsetType: Item

  - preconditions:
    - !type:SearchQueryValid
      query: OffsetStoredCrate
    actions:
    - !type:SearchQuery
      query: OffsetStoredCrate
      targetKey: StoringTarget
    - !type:RemoveFromStock
      targetKey: StoringTarget
    effects:
      StoringOffsetType: Crate

  - preconditions:
    - StoringOffsetType == Item
    actions:
    - !type:StoringItem
      targetKey: StoringTarget
    effects:
      StoredOffsetFixed: true

  - preconditions:
    - StoringOffsetType == Crate
    actions:
    - !type:StoringCrate
      targetKey: StoringTarget
    effects:
      StoredOffsetFixed: true

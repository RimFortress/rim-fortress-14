    - !type:CaptureQuery
      capture: Query/BluntHeal
      targetKey: DamageHeal
    - !type:CaptureQuery
      capture: Query/BluntHealTarget
      targetKey: DamageHealTarget
    effects:
      DamageHeal: true
      DamageHealTarget: true


  #

  - preconditions:
    - DamageHeal != null
    actions:
    - !type:EntityCoords
      targetKey: DamageHeal
    - !type:MoveTo
      rangeKey: InteractRange
    - !type:Pickup
      targetKey: DamageHeal
    effects:
      DamageHealPickedUp: true

  - preconditions:
    - DamageHealPickedUp == true
    - DamageHealTarget != null
    actions:
    - !type:EntityCoords
      targetKey: DamageHealTarget
    - !type:MoveTo
      rangeKey: InteractRange
    - !type:InteractWith
      targetKey: DamageHealTarget
    effects:
      DamageHealed: true

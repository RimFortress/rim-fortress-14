- type: goapCompound
  id: RestoreBloodLevel
  tasks:
  - preconditions:
    - Query/BloodLevelHealing != null
    actions:
    - !type:EntityCoords
      targetKey: Query/BloodLevelHealing
    - !type:MoveTo
      rangeKey: InteractRange
    - !type:Pickup
      targetKey: Query/BloodLevelHealing
    effects:
      BloodLevelHealingPickedUp: true

  - preconditions:
    - Query/LowBloodLevelFriend != null
    - Engagement/Healing/In == true
    actions:
    - !type:InviteEngagement
      engageKey: Engagement/Healing
      targetKey: Query/LowBloodLevelFriend
      roles: [ HealedFriened ]
    effects:
      LowBloodLevelFriendEngaged: true

  - preconditions:
    - LowBloodLevelFriendEngaged == true
    - BloodLevelHealingPickedUp == true
    actions:
    - !type:EntityCoords
      targetKey: Query/LowBloodLevelFriend
    - !type:MoveTo
      rangeKey: InteractRange
    - !type:InteractWith
      targetKey: Query/LowBloodLevelFriend
    effects:
      BloodLevelRestored: true

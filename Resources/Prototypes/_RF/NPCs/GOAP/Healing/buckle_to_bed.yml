- type: goapCompound
  id: HealingBuckle
  tasks:
  - preconditions:
    - Query/HealingBuckleTarget != null
    actions:
    - !type:MoveTo
      targetEntityKey: &Target Query/HealingBuckleTarget
      rangeKey: InteractRange
    - !type:Pull
      targetKey: *Target
    effects:
      TargetPulled: true

  - preconditions:
    - Query/HealingBuckleTarget != null
    - Engagement/Healing/In == true
    actions:
    - !type:InviteEngagement
      engageKey: Engagement/Healing
      targetKey: Query/HealingBuckleTarget
      roles: [ HealedFriened ]
    effects:
      HealingBuckleTargetEngaged: true

  - preconditions:
    - HealingBuckleTargetEngaged == true
    - TargetPulled == true
    - Query/Bed != null
    actions:
    - !type:EntityCoords
      targetKey: Query/Bed
    - !type:MoveTo
      rangeKey: InteractRange
      removeKeyOnFinish: false
    - !type:MovePulling
    - !type:Buckle
      targetKey: *Target
      buckleTo: Query/Bed
    - !type:UnPull
    effects:
      TargetBuckledToBed: true

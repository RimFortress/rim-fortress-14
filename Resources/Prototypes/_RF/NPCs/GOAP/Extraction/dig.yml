- type: goapCompound
  id: Dig
  tasks:
  - preconditions:
    - !type:SearchQueryValid
      query: DigPassiveTarget
    action: !type:SearchQuery
      query: DigPassiveTarget
      targetKey: DigTarget
    effects:
      DigTarget: true

  - preconditions:
    - !type:SearchQueryValid
      query: Pickaxe
    action: !type:SearchQuery
      query: Pickaxe
      targetKey: PickupTarget
    effects:
      PickaxeFound: true

  - preconditions:
    - InContainer == false
    - Buckled == false
    - Pulled == false
    - PickaxeFound == true
    actions:
    - !type:EntityCoords
      targetKey: PickupTarget
    - !type:MoveTo
      rangeKey: InteractRange
    - !type:Pickup
      targetKey: PickupTarget
    - !type:Wield
      targetState: true
    effects:
      PickaxePickedUp: true

  - preconditions:
    - DigTarget != null
    - PickaxePickedUp == true
    actions:
    - !type:Melee
      targetKey: DigTarget
    - !type:MarkOwnerInRange
    effects:
      TargetDug: true

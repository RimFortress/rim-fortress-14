- type: goapCompound
  id: Chop
  tasks:
  - preconditions:
    - InContainer == false
    - Buckled == false
    - Pulled == false
    - Query/Axe != null
    actions:
    - !type:MoveTo
      targetEntityKey: Query/Axe
      rangeKey: InteractRange
    - !type:Pickup
      targetKey: Query/Axe
    - !type:Wield
      targetState: true
    effects:
      AxePickedUp: true

  - preconditions:
    - AxePickedUp == true
    - Query/ChopTarget != null
    actions:
    - !type:MoveTo
      targetEntityKey: Query/ChopTarget
      rangeKey: InteractRange
    - !type:Melee
      targetKey: Query/ChopTarget
    - !type:MarkOwnerInRange
      range: 3
      whitelist:
        components:
        - ToolRefinable # the logs
    effects:
      TargetChopDown: true

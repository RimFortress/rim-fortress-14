- type: goapCompound
  id: Chop
  tasks:
  - preconditions:
    - !type:SearchQueryValid
      query: ChopPassiveTarget
    action: !type:SearchQuery
      query: ChopPassiveTarget
      targetKey: ChopTarget
    effects:
      ChopTarget: true

  - preconditions:
    - !type:SearchQueryValid
      query: Axe
    action: !type:SearchQuery
      query: Axe
      targetKey: Axe
    effects:
      Axe: true

  - preconditions:
    - InContainer == false
    - Buckled == false
    - Pulled == false
    - Axe != null
    actions:
    - !type:EntityCoords
      targetKey: Axe
    - !type:MoveTo
      rangeKey: InteractRange
    - !type:Pickup
      targetKey: Axe
    - !type:Wield
      targetKey: Axe
      targetState: true
    effects:
      AxePickedUp: true

  - preconditions:
    - AxePickedUp == true
    actions:
    - !type:EntityCoords
      targetKey: ChopTarget
    - !type:MoveTo
      rangeKey: InteractRange
    - !type:Pickup
      targetKey: Axe
    - !type:Melee
      targetKey: ChopTarget
    - !type:MarkOwnerInRange
    effects:
      TargetChopDown: true

# Query

- type: searchQuery
  id: ChopPassiveTarget
  query: !type:PassiveTargets
    goals:
    - Chop
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

- type: searchQuery
  id: Axe
  query: !type:Owned
  filters:
  - !type:HasTags
    tags:
    - FireAxe
    - BotanyHatchet
    requireAll: false
    invert: true
  - !type:InInventory
  - !type:InHands
  - !type:Accessible
    invert: true
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

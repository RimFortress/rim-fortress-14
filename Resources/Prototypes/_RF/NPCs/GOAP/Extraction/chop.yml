- type: goapCompound
  id: Chop
  tasks:
  - preconditions:
    - !type:SearchQueryValid
      query: ChopPassiveTarget
    action: !type:SearchQuery
      query: ChopPassiveTarget
      targetKey: ChopTarget
    effects:
      ChopTarget: true

  - preconditions:
    - !type:SearchQueryValid
      query: Axe
    action: !type:SearchQuery
      query: Axe
      targetKey: Axe
    effects:
      Axe: true

  - preconditions:
    - InContainer == false
    - Buckled == false
    - Pulled == false
    - Axe != null
    actions:
    - !type:EntityCoords
      targetKey: Axe
    - !type:MoveTo
      rangeKey: InteractRange
    - !type:Pickup
      targetKey: Axe
    - !type:Wield
      targetKey: Axe
      targetState: true
    effects:
      AxePickedUp: true

  - preconditions:
    - AxePickedUp == true
    - ChopTarget != null
    actions:
    - !type:EntityCoords
      targetKey: ChopTarget
    - !type:MoveTo
      rangeKey: InteractRange
    - !type:Pickup
      targetKey: Axe
    - !type:Melee
      targetKey: ChopTarget
    - !type:MarkOwnerInRange
      whitelist:
        components:
        - Log
    effects:
      TargetChopDown: true

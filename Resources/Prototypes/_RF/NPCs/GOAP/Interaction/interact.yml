- type: goapCompound
  id: Interact
  tasks:
  - preconditions:
    - ActiveHandFree == true
    - InContainer == false
    - Buckled == false
    - Pulled == false
    actions:
    - !type:MoveTo
      targetEntityKey: Target
      rangeKey: InteractRange
    - !type:InteractWith
      targetKey: Target
    effects:
      TargetInteracted: true

- type: goapCompound
  id: InventoryStorage
  tasks:
  - preconditions:
    - InContainer == false
    - Buckled == false
    - Pulled == false
    actions:
    - !type:MoveTo
      targetEntityKey: Target
      rangeKey: InteractRange
    - !type:Storage
      targetKey: Target
    - !type:MarkOwner
      targetKey: Target
    effects:
      TargetStoredInInventory: true

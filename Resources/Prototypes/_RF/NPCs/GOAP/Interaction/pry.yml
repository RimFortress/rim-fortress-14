- type: goapCompound
  id: Pry
  tasks:
  - preconditions:
    - InContainer == false
    - Buckled == false
    - Pulled == false
    - Query/Crowbar != null
    actions:
    - !type:MoveTo
      targetEntityKey: Query/Crowbar
      rangeKey: InteractRange
    - !type:Pickup
      targetKey: Query/Crowbar
    effects:
      CrowbarPickedUp: true

  - preconditions:
    - CrowbarPickedUp == true
    actions:
    - !type:MoveTo
      targetEntityKey: Target
      rangeKey: InteractRange
    - !type:InteractWith
      targetKey: Target
    effects:
      TargetPry: true

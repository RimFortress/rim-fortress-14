- type: goapCompound
  id: Pry
  tasks:
  - preconditions:
    - !type:SearchQueryValid
      query: Crowbar
    action: !type:SearchQuery
      query: Crowbar
      targetKey: Crowbar
    effects:
      Crowbar: true

  - preconditions:
    - InContainer == false
    - Buckled == false
    - Pulled == false
    - Crowbar != null
    actions:
    - !type:EntityCoords
      targetKey: Crowbar
    - !type:MoveTo
      rangeKey: InteractRange
    - !type:Pickup
      targetKey: Crowbar
    effects:
      CrowbarPickedUp: true

  - preconditions:
    - CrowbarPickedUp == true
    actions:
    - !type:EntityCoords
      targetKey: Target
    - !type:MoveTo
      rangeKey: InteractRange
    - !type:InteractWith
      targetKey: Target
    effects:
      TargetPry: true

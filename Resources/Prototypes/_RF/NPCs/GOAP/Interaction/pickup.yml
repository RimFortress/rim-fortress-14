- type: goapCompound
  id: Pickup
  tasks:
  - preconditions:
    - InContainer == false
    - Buckled == false
    - Pulled == false
    actions:
    - !type:MoveTo
      targetEntityKey: PickupTarget
      rangeKey: InteractRange
    - !type:Pickup
      targetKey: PickupTarget
    - !type:MarkOwner
      targetKey: PickupTarget
    effects:
      TargetPickedUp: true

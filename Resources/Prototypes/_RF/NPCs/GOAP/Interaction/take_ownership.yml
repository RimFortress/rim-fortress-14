- type: goapCompound
  id: TakeOwnership
  tasks:
  - preconditions:
    - !type:SearchQueryValid
      query: TakeOwnershipPassiveTarget
    action: !type:SearchQuery
      query: TakeOwnershipPassiveTarget
      targetKey: TakeOwnershipTarget
    effects:
      TakeOwnershipTarget: true

  - preconditions:
    - InContainer == false
    - Buckled == false
    - Pulled == false
    - TakeOwnershipTarget != null
    actions:
    - !type:EntityCoords
      targetKey: TakeOwnershipTarget
    - !type:MoveTo
      rangeKey: InteractRange
    - !type:MarkOwner
      targetKey: TakeOwnershipTarget
    effects:
      TargetOwned: true

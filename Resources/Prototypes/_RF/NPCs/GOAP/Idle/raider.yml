# What a raider can do. It has no chores of a settler.
- type: goapCompound
  id: RaiderIdle
  tasks:
  - proto: Utility
  - proto: Door
  - proto: Climb
  - proto: Pickup
  - proto: Combat
  - proto: RaiderApproach
  - proto: RaiderAdvance
  - proto: RaiderRetreat

- type: goapCompound
  id: RaiderApproach
  tasks:
  - preconditions:
    - InContainer == false
    - Buckled == false
    - Pulled == false
    - Query/RaidObjective != null
    actions:
    - !type:MoveTo
      targetEntityKey: Query/RaidObjective
      rangeKey: RaidApproachRange
      query: Approach
    effects:
      RaiderApproached: true

- type: goapCompound
  id: RaiderAdvance
  tasks:
  - preconditions:
    - InContainer == false
    - Buckled == false
    - Pulled == false
    actions:
    - !type:MoveTo
      targetKey: Engagement/Raid/Owner/SettlementTarget
      rangeKey: IdleRange
    effects:
      RaiderAdvanced: true

- type: goapCompound
  id: RaiderRetreat
  tasks:
  - preconditions:
    - InContainer == false
    - Buckled == false
    - Pulled == false
    actions:
    - !type:PickAccessible
      rangeKey: RetreatRange
      query: Retreat
    - !type:MoveTo
      rangeKey: IdleRange
    effects:
      RaiderRetreated: true

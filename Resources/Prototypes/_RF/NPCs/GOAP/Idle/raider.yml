# What a raider can do. It has no chores of a settler.
- type: goapCompound
  id: RaiderIdle
  tasks:
  - proto: Utility
  - proto: Door
  - proto: Climb
  - proto: Breach
  - proto: Pickup
  - proto: Combat
  - proto: Healing
  - proto: Rescue
  - proto: RaiderHold
  - proto: RaiderFollow
  - proto: RaiderApproach
  - proto: RaiderAdvance
  - proto: RaiderRetreat

- type: goapCompound
  id: RaiderHold
  tasks:
  - preconditions:
    - Engagement/RaidSquad/Var/stance < 0.5
    actions:
    - !type:WaitWhile
      conditions:
      - Engagement/RaidSquad/Var/stance < 0.5
    effects:
      RaiderHeld: true

- type: goapCompound
  id: RaiderFollow
  tasks:
  - preconditions:
    - InContainer == false
    - Buckled == false
    - Pulled == false
    - Engagement/RaidSquad/Role/SquadLeader != null
    actions:
    - !type:MoveTo
      targetEntityKey: Engagement/RaidSquad/Role/SquadLeader
      rangeKey: SquadFollowRange
      query: Approach
    effects:
      RaiderFollowed: true

- type: goapCompound
  id: RaiderApproach
  tasks:
  - preconditions:
    - InContainer == false
    - Buckled == false
    - Pulled == false
    - Query/RaidObjective != null
    actions:
    - !type:MoveTo
      targetEntityKey: Query/RaidObjective
      rangeKey: RaidApproachRange
      query: Approach
    effects:
      RaiderApproached: true

- type: goapCompound
  id: RaiderAdvance
  tasks:
  - preconditions:
    - InContainer == false
    - Buckled == false
    - Pulled == false
    actions:
    - !type:MoveTo
      targetKey: Engagement/RaidForce/Owner/SettlementTarget
      rangeKey: IdleRange
    effects:
      RaiderAdvanced: true

- type: goapCompound
  id: RaiderRetreat
  tasks:
  - preconditions:
    - InContainer == false
    - Buckled == false
    - Pulled == false
    actions:
    - !type:PickAccessible
      rangeKey: RetreatRange
      query: Retreat
    - !type:MoveTo
      rangeKey: IdleRange
    effects:
      RaiderRetreated: true

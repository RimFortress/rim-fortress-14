- type: goapCompound
  id: Combat
  tasks:
  # Search
  - preconditions:
    - Query/InventoryGuns || Query/NearbyGuns != null
    actions:
    - !type:CaptureQuery
      capture: Query/InventoryGuns || Query/NearbyGuns
      targetKey: WeaponTarget
    effects:
      GunFound: true
      WeaponTarget: true

  - preconditions:
    - Query/InventoryMelees || Query/NearbyMelees != null
    actions:
    - !type:CaptureQuery
      capture: Query/InventoryMelees || Query/NearbyMelees
      targetKey: WeaponTarget
      costMultiplier: 2
    effects:
      MeleeFound: true
      WeaponTarget: true

  # Pickup
  - preconditions:
    - InContainer == false
    - Buckled == false
    - Pulled == false
    - WeaponTarget != null
    actions:
    - !type:MoveTo
      targetEntityKey: WeaponTarget
      rangeKey: InteractRange
      sprint: true
    - !type:Pickup
      targetKey: WeaponTarget
    - !type:Wield
      targetState: true
    effects:
      WeaponPickedUp: true

  # Gun
  - preconditions:
    - GunFound == true
    - WeaponPickedUp == true
    - Query/AttackTarget || Query/HostileTarget != null
    actions:
    - !type:MoveTo
      targetEntityKey: Query/AttackTarget || Query/HostileTarget
      rangeKey: MeleeRange
      stopOnLineOfSight: true
      sprint: true
    - !type:Gun
      targetKey: Query/AttackTarget || Query/HostileTarget
      removeCombatMode: false
    effects:
      TargetAttacked: true

  # Melee
  - preconditions:
    - MeleeFound == true
    - WeaponPickedUp == true
    - Query/AttackTarget || Query/HostileTarget != null
    actions:
    - !type:Wield
      targetState: true
    - !type:MoveTo
      targetEntityKey: Query/AttackTarget || Query/HostileTarget
      rangeKey: MeleeRange
      sprint: true
    - !type:Melee
      targetKey: Query/AttackTarget || Query/HostileTarget
      removeCombatMode: false
      costMultiplier: 4
      footwork: {}
    effects:
      TargetAttacked: true

  # Fistfight
  - preconditions:
    - WeaponTarget == null
    - Query/AttackTarget || Query/HostileTarget != null
    actions:
    - !type:MoveTo
      targetEntityKey: Query/AttackTarget || Query/HostileTarget
      rangeKey: MeleeRange
      sprint: true
    - !type:Melee
      targetKey: Query/AttackTarget || Query/HostileTarget
      removeCombatMode: false
      costMultiplier: 100 # A fistfight is the least desirable option
      footwork: {}
    effects:
      TargetAttacked: true

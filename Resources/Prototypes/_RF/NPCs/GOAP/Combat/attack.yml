- type: goapCompound
  id: Combat
  tasks:
  # Search
  - preconditions:
    - !type:SearchQueryValid
      query: AttackPassiveTarget
    action: !type:SearchQuery
      query: AttackPassiveTarget
      targetKey: AttackTarget
    effects:
      AttackTarget: true

  - preconditions:
    - !type:SearchQueryValid
      query: InventoryGuns
    action: !type:SearchQuery
      query: InventoryGuns
      targetKey: WeaponTarget
    effects:
      GunFound: true
      WeaponTarget: true

  - preconditions:
    - !type:SearchQueryValid
      query: InventoryMelees
    action: !type:SearchQuery
      query: InventoryMelees
      targetKey: WeaponTarget
    effects:
      MeleeFound: true
      WeaponTarget: true

  - preconditions:
    - !type:SearchQueryValid
      query: NearbyGuns
    action: !type:SearchQuery
      query: NearbyGuns
      targetKey: WeaponTarget
      costMultiplier: 2
    effects:
      GunFound: true
      WeaponTarget: true

  - preconditions:
    - !type:SearchQueryValid
      query: NearbyMelees
    action: !type:SearchQuery
      query: NearbyMelees
      targetKey: WeaponTarget
      costMultiplier: 2
    effects:
      MeleeFound: true
      WeaponTarget: true

  # Pickup
  - preconditions:
    - InContainer == false
    - Buckled == false
    - Pulled == false
    - WeaponTarget != null
    actions:
    - !type:EntityCoords
      targetKey: WeaponTarget
    - !type:MoveTo
      rangeKey: InteractRange
    - !type:Pickup
      targetKey: WeaponTarget
    effects:
      WeaponPickedUp: true

  # Gun
  - preconditions:
    - GunFound == true
    - WeaponPickedUp == true
    - AttackTarget != null
    actions:
    - !type:EntityCoords
      targetKey: AttackTarget
    - !type:MoveTo
      rangeKey: MeleeRange
      stopOnLineOfSight: true
    - !type:Juke
      jukeType: Away
    - !type:Gun
      targetKey: AttackTarget
    effects:
      TargetAttacked: true

  # Melee
  - preconditions:
    - MeleeFound == true
    - WeaponPickedUp == true
    - AttackTarget != null
    actions:
    - !type:Wield
      targetState: true
    - !type:EntityCoords
      targetKey: AttackTarget
    - !type:MoveTo
      rangeKey: MeleeRange
    - !type:Juke
    - !type:Melee
      targetKey: AttackTarget
      costMultiplier: 4
    effects:
      TargetAttacked: true

  # Fistfight
  - preconditions:
    - WeaponTarget == null
    - AttackTarget != null
    actions:
    - !type:EntityCoords
      targetKey: AttackTarget
    - !type:MoveTo
      rangeKey: MeleeRange
    - !type:Juke
    - !type:Melee
      targetKey: AttackTarget
      costMultiplier: 100 # A fistfight is the least desirable option
    effects:
      TargetAttacked: true

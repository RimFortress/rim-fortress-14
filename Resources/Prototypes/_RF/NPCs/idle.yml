- type: goapCompound
  id: Idle
  tasks:
  - proto: Sleep
  - proto: MoveTo
  - proto: Escape
  - proto: Pickup
  - proto: Eat
  - proto: Drink
  - proto: Construction
  - proto: Deconstruct
  - proto: Dig
  - proto: TakeOwnership
  - proto: Interact
  - proto: Pry
  - proto: Chop

  - preconditions:
    - InContainer == false
    actions:
    - !type:PickAccessible
      rangeKey: IdleRange
    - !type:MoveTo
      rangeKey: InteractRange
      findPath: false
    - !type:RandomTime
      key: IdleTime
      minSec: 2
      maxSec: 7
    - !type:Wait
      timeKey: IdleTime
    effects:
      Idle: true

- type: htnCompound
  id: RfIdleCompound
  branches:
  - tasks:
    - !type:HTNCompoundTask
      task: DrinkCompound
  - tasks:
    - !type:HTNCompoundTask
      task: EatCompound
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:RoutineTaskOperator
  - tasks:
    - !type:HTNCompoundTask
      task: IdleMoveCompound

- type: htnCompound
  id: RaidIdleCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: NearbyMeleeTargets
    - !type:HTNCompoundTask
      task: AttackTargetCompound

  - tasks:
    - !type:HTNCompoundTask
      task: IdleMoveCompound

- type: htnCompound
  id: IdleMoveCompound
  branches:
  - preconditions:
    - !type:InContainerPrecondition
      isInContainer: true
    tasks:
    - !type:HTNCompoundTask
      task: EscapeCompound

  # Pick a new spot and wait there.
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:PickAccessibleOperator
        rangeKey: IdleRange
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: false
    - !type:HTNPrimitiveTask
      operator: !type:RandomOperator
        targetKey: IdleTime
        minKey: MinimumIdleTime
        maxKey: MaximumIdleTime
    - !type:HTNPrimitiveTask
      operator: !type:WaitOperator
        key: IdleTime

- type: htnCompound
  id: EatCompound
  branches:
  - preconditions:
    - !type:HasComponentPrecondition
      components:
      - type: ActiveDoAfter
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:SetFloatOperator
        targetKey: Time
        amount: 0.5
    - !type:HTNPrimitiveTask
      operator: !type:WaitOperator
        key: Time

  - preconditions:
    - !type:HungryPrecondition
      minHungerState: Starving
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: Food
        key: PickUpTarget
    - !type:HTNCompoundTask
        task: PickUpCompound
    - !type:HTNPrimitiveTask
      operator: !type:InteractWithOperator
        targetKey: PickUpTarget

- type: htnCompound
  id: DrinkCompound
  branches:
  - preconditions:
    - !type:HasComponentPrecondition
      components:
      - type: ActiveDoAfter
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:SetFloatOperator
        targetKey: Time
        amount: 0.5
    - !type:HTNPrimitiveTask
      operator: !type:WaitOperator
        key: Time

  - preconditions:
    - !type:ThirstyPrecondition
      minThirstState: Parched
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: Drink
        key: PickUpTarget
    - !type:HTNCompoundTask
        task: PickUpCompound
    - !type:HTNPrimitiveTask
      operator: !type:InteractWithOperator
        targetKey: PickUpTarget

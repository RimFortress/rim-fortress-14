- type: htnCompound
  id: RfIdleCompound
  branches:
  - preconditions:
    - !type:InConversationPrecondition
    - !type:ActorsHasTaskPrecondition
      invert: true
    tasks:
    - !type:HTNCompoundTask
      task: ConversationCompound

  - preconditions:
    - !type:InConversationPrecondition
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:EndConversationOperator

  # Going to sleep on the bed if we are very tired
  - preconditions:
    - !type:NeedLevelPrecondition
      need: Sleep
      lessThan: 30
    - !type:RandomPrecondition
      chance: 0.1
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: Bed
    - !type:HTNCompoundTask
      task: SleepCompound

  # Or we sleep on the floor if there is no free bed
  - preconditions:
    - !type:NeedLevelPrecondition
      need: Sleep
      lessThan: 30
    - !type:RandomPrecondition
      chance: 0.1
    tasks:
    - !type:HTNCompoundTask
      task: SleepOnFloorCompound

  # Looking for food if we are hungry
  - preconditions:
    - !type:OrPrecondition
      preconditions:
      - !type:HungryPrecondition
        minHungerState: Starving
      - !type:AndPrecondition
        preconditions:
        - !type:HungryPrecondition
          minHungerState: Peckish
        - !type:RandomPrecondition
          chance: 0.1
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: Food
        key: PickUpTarget
    - !type:HTNCompoundTask
      task: EatCompound

  # Looking for a drink if we're thirsty
  - preconditions:
    - !type:OrPrecondition
      preconditions:
      - !type:ThirstyPrecondition
        minThirstState: Parched
      - !type:AndPrecondition
        preconditions:
        - !type:ThirstyPrecondition
          minThirstState: Thirsty
        - !type:RandomPrecondition
          chance: 0.1
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: Drink
        key: PickUpTarget
    - !type:HTNCompoundTask
      task: DrinkCompound

  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:RoutineTaskOperator

  - tasks:
    - !type:HTNCompoundTask
      task: IdleMoveCompound

- type: htnCompound
  id: IdleMoveCompound
  branches:
  - preconditions:
    - !type:InContainerPrecondition
      isInContainer: true
    tasks:
    - !type:HTNCompoundTask
      task: EscapeCompound

  # Pick a new spot and wait there.
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:PickAccessibleOperator
        rangeKey: IdleRange
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: false
    - !type:HTNPrimitiveTask
      operator: !type:RandomOperator
        targetKey: IdleTime
        minKey: MinimumIdleTime
        maxKey: MaximumIdleTime
    - !type:HTNPrimitiveTask
      operator: !type:WaitOperator
        key: IdleTime

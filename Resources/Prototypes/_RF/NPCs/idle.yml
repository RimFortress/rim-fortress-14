- type: goapCompound
  id: Idle
  tasks:
  - proto: Sleep
  - proto: MoveTo
  - proto: Escape
  - proto: Pickup

  - preconditions:
    - InContainer == false
    actions:
    - !type:PickAccessible
      rangeKey: IdleRange
    - !type:MoveTo
      findPath: false
    - !type:RandomFloat
      key: IdleTime
      min: 2
      max: 7
    - !type:Wait
      timeKey: IdleTime
    effects:
      Idle: true

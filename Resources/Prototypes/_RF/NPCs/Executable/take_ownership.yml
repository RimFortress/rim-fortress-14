- type: executableGoal
  id: TakeOwnership
  goal: TakeOwnership
  verbIcon: _RF/Interface/VerbIcons/house-flag-solid-full.svg.192dpi.png
  targetKey: TakeOwnershipTarget
  maxPerformers: 1
  goalType:
  - Verb
  - Passive
  targetWhitelist:
    components:
    - Item

- type: utilityAiGoal
  id: TakeOwnership
  color: "#075967"
  scoreCurves:
  - float: 0.8
  goalState:
    TargetOwned: true

- type: goapCompound
  id: TakeOwnership
  tasks:
  - preconditions:
    - !type:SearchQueryValid
      query: TakeOwnershipPassiveTarget
    action: !type:SearchQuery
      query: TakeOwnershipPassiveTarget
      targetKey: TakeOwnershipTarget
    effects:
      TakeOwnershipTarget: true

  - preconditions:
    - InContainer == false
    - Buckled == false
    - Pulled == false
    - TakeOwnershipTarget != null
    actions:
    - !type:EntityCoords
      targetKey: TakeOwnershipTarget
    - !type:MoveTo
      rangeKey: InteractRange
    - !type:MarkOwner
      targetKey: TakeOwnershipTarget
    effects:
      TargetOwned: true

- type: searchQuery
  id: TakeOwnershipPassiveTarget
  query: !type:PassiveTargets
    goals:
    - TakeOwnership
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

- type: executableGoal
  id: TakeOwnership
  goal: TakeOwnership
  verbIcon: /Textures/_RF/Interface/VerbIcons/house-flag-solid-full.svg.192dpi.png
  targetKey: TakeOwnershipTarget
  maxPerformers: 1
  goalType:
  - Verb
  - Passive
  targetWhitelist:
    components:
    - Item

- type: goapCompound
  id: TakeOwnership
  tasks:
  - preconditions:
    - !type:SearchQueryValid
      query: TakeOwnershipPassiveTarget
    action: !type:SearchQuery
      query: TakeOwnershipPassiveTarget
      targetKey: TakeOwnershipTarget
    effects:
      TakeOwnershipTarget: true

  - preconditions:
    - TakeOwnershipTarget != null
    actions:
    - !type:EntityCoords
      targetKey: TakeOwnershipTarget
    - !type:MoveTo
      rangeKey: InteractRange
    - !type:MarkOwner
      targetKey: TakeOwnershipTarget
    effects:
      TargetOwned: true

- type: searchQuery
  id: TakeOwnershipPassiveTarget
  query: !type:PassiveTargets
    goals:
    - TakeOwnership
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

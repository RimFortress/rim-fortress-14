- type: executableGoal
  id: Dig
  goal: Dig
  verbIcon: /Textures/_RF/Interface/VerbIcons/person-digging-solid.svg.192dpi.png
  targetKey: DigTarget
  maxPerformers: 1
  goalType:
  - Verb
  - Passive
  targetWhitelist:
    tags:
    - Diggable

- type: utilityAiGoal
  id: Dig
  color: "#E36414"
  scoreCurves:
  - !type:SkillLevel
    skill: Mining
  - div:
    - float: 3
  - add:
    - !type:PassiveTargets
      goal: Dig
    - !type:Normalize
    - pow:
      - float: 2
    - div:
      - !type:GoalPerformers
        goal: Dig
      - clamp:
          min: 1
          max: 10
    - mul:
      - float: 0.35
  goalState:
    TargetDug: true

# Compound

- type: goapCompound
  id: Dig
  tasks:
  - preconditions:
    - !type:SearchQueryValid
      query: DigPassiveTarget
    action: !type:SearchQuery
      query: DigPassiveTarget
      targetKey: DigTarget
    effects:
      DigTarget: true

  - preconditions:
    - !type:SearchQueryValid
      query: PickaxeWieldabe
    action: !type:SearchQuery
      query: PickaxeWieldabe
      targetKey: PickupTarget
    effects:
      Wieldable: true
      PickaxeFound: true

  - preconditions:
    - !type:SearchQueryValid
      query: Pickaxe
    action: !type:SearchQuery
      query: Pickaxe
      targetKey: PickupTarget
      costMultiplier: 2.5
    effects:
      Wielded: false
      PickaxeFound: true

  - preconditions:
    - InContainer == false
    - PickaxeFound == true
    actions:
    - !type:EntityCoords
      targetKey: PickupTarget
    - !type:MoveTo
      rangeKey: InteractRange
    - !type:Pickup
      targetKey: PickupTarget
    effects:
      PickaxePickedUp: true

  - preconditions:
    - Wieldable == true
    - PickaxePickedUp == true
    action: !type:Wield
      targetState: true
    effects:
      Wielded: true

  - preconditions:
    - Wielded != null
    - DigTarget != null
    - PickaxePickedUp == true
    actions:
    - !type:Melee
      targetKey: DigTarget
    - !type:MarkOwnerInRange
    effects:
      TargetDug: true

# Queries

- type: searchQuery
  id: DigPassiveTarget
  query: !type:PassiveTargets
    goals:
    - Dig
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

- type: searchQuery
  id: PickaxeWieldabe
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: Wieldable
    invert: true
  - !type:HasTags
    tags:
    - Pickaxe
    invert: true
  - !type:InInventory
  - !type:InHands
  - !type:Accessible
    invert: true
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

- type: searchQuery
  id: Pickaxe
  query: !type:Owned
  filters:
  - !type:HasTags
    tags:
    - Pickaxe
    invert: true
  - !type:InInventory
  - !type:InHands
  - !type:Accessible
    invert: true
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

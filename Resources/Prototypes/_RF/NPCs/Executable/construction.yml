- type: executableGoal
  id: Construction
  goal: Construction
  verbIcon: /Textures/_RF/Interface/hammer-solid.svg.192dpi.png
  targetKey: ConstructionTarget
  maxPerformers: 1
  targetWhitelist:
    components:
    - CommonConstructionGhost
    - Construction

- type: utilityAiGoal
  id: Construction
  color: "#FFFF00"
  scoreCurves:
  - !type:SkillLevel
    skill: Construction
  - div:
    - float: 3
  - add:
    - !type:SearchQueryCount
      query: ConstructionTarget
    - !type:Normalize
    - div:
      - !type:GoalPerformers
        goal: Construction
      - minus:
        - float: 1
      - clamp:
          min: 1
          max: 4
    - mul:
      - float: 0.55
  goalState:
    TargetConstructed: true

- type: goapCompound
  id: Construction
  tasks:
  - preconditions:
    - !type:SearchQueryValid
      query: ConstructionTarget
    action: !type:SearchQuery
      query: ConstructionTarget
      targetKey: ConstructionTarget
    effects:
      ConstructionTarget: true

  - preconditions:
    - ConstructionTarget != null
    action: !type:Construction
      targetKey: ConstructionTarget
    effects:
      TargetConstructed: true

- type: searchQuery
  id: ConstructionTarget
  query: !type:Owned
  filters:
  - !type:Component
    components:
    - type: CommonConstructionGhost
    - type: Construction
      graph: FloorBananium
      node: BananiumFloor
    requireAll: false
    invert: true
  - !type:Constructed
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

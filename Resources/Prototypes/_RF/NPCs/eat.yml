- type: goapCompound
  id: Eat
  tasks:
  - preconditions:
    - !type:SearchQueryValid
      query: FoodOpened
    action: !type:SearchQuery
      query: FoodOpened
      targetKey: PickupTarget
    effects:
      FoodFound: true
      FoodOpened: true

  - preconditions:
    - !type:SearchQueryValid
      query: FoodClosed
    action: !type:SearchQuery
      query: FoodClosed
      targetKey: PickupTarget
    effects:
      FoodFound: true
      FoodOpened: false

  - preconditions:
    - InContainer == false
    - FoodFound == true
    actions:
    - !type:EntityCoords
      targetKey: PickupTarget
    - !type:MoveTo
      rangeKey: InteractRange
    - !type:Pickup
      targetKey: PickupTarget
    effects:
      FoodPickedUp: true

  - preconditions:
    - FoodPickedUp == true
    action: !type:InteractWith
      targetKey: PickupTarget
    effects:
      FoodOpened: true

  - preconditions:
    - FoodPickedUp == true
    - FoodOpened == true
    action: !type:InteractWith
      targetKey: PickupTarget
    effects:
      FoodEaten: true

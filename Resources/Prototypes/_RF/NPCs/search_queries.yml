- type: searchQuery
  id: Bed
  query: !type:Owned
  considerations:
  - !type:BuckleHealing
    curves:
    - !type:Normalize
  - !type:TargetDistance
    curves:
    - preset: TargetDistance

- type: searchQuery
  id: FoodOpened
  query: !type:Owned
  filters:
  - !type:IsAlive
  - !type:IsClosed
  - !type:InInventory
  - !type:InHands
  - !type:Accessible
    invert: true
  considerations:
  - !type:TargetDistance
    curves:
    - preset: TargetDistance
  - !type:TotalNutrition
    curves:
    - !type:Normalize
    - !type:Quadratic
      slope: 1
      exponent: 0.4

- type: searchQuery
  id: FoodClosed
  query: !type:Owned

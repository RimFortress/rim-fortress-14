- type: htnCompound
  id: SleepCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:EntityCoordinatesOperator
        targetKey: Target
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        rangeKey: InteractRange
    - !type:HTNPrimitiveTask
      operator: !type:BuckleOperator
        buckleKey: TargetKey
    - !type:HTNPrimitiveTask
      operator: !type:SleepOperator

    # Wait until we get enough sleep
    - !type:HTNPrimitiveTask
      operator: !type:WaitWhileOperator
        preconditions:
        - !type:NeedLevelPrecondition
          need: Sleep
          thresholdId: Rested
          invert: true
        - !type:NeedLevelPrecondition
          need: Sleep
          thresholdId: Overslept
          invert: true

    # Wake up samurai
    - !type:HTNPrimitiveTask
      operator: !type:WakeUpOperator
    - !type:HTNPrimitiveTask
      operator: !type:UnbuckleOperator

- type: htnCompound
  id: SleepOnFloorCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:PickAccessibleOperator
        rangeKey: IdleRange
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        rangeKey: MoveToCloseRange
        pathfindInPlanning: false
    - !type:HTNPrimitiveTask
      operator: !type:SleepOperator

    # Wait until we get enough sleep
    - !type:HTNPrimitiveTask
      operator: !type:WaitWhileOperator
        preconditions:
        - !type:NeedLevelPrecondition
          need: Sleep
          thresholdId: Rested
          invert: true
        - !type:NeedLevelPrecondition
          need: Sleep
          thresholdId: Overslept
          invert: true

    - !type:HTNPrimitiveTask
      operator: !type:WakeUpOperator
    - !type:HTNPrimitiveTask
      operator: !type:UnbuckleOperator

    - !type:HTNPrimitiveTask
      operator: !type:AddMoodEffectOperator
        effect: MoodSleptOnFloor

- type: reagent
  id: !PartialOnly Stimulants
  metabolisms:
    Bloodstream:
      effects: !Clear
      # Main effects
      - !type:MovementSpeedModifier
        walkSpeedModifier: 1.25
        sprintSpeedModifier: 1.25
      - !type:ModifyStatusEffect
        effectProto: StatusEffectStimulantsStamina # You are on meth. You keep going.
        time: 3
      - !type:ModifyStatusEffect
        effectProto: StatusEffectStunned
        time: 3.5
        type: Remove
      - !type:ModifyKnockdown
        time: 3.5
        type: Remove
      - !type:ModifyStatusEffect
        effectProto: StatusEffectForcedSleeping
        time: 3
        type: Remove
      - !type:ModifyStatusEffect
        effectProto: StatusEffectAdrenaline
        time: 3
      # Side effects
      - !type:Jitter
      # OD
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Stimulants
          min: 45
        damage:
          types:
            Poison: 3
      # Interactions
      - !type:ModifyStatusEffect
        conditions:
        - !type:ReagentCondition
          reagent: Haloperidol
          max: 0.01
        effectProto: StatusEffectDrowsiness
        time: 10
        type: Remove
      - !type:AdjustReagent
        conditions:
        - !type:ReagentCondition
          reagent: ChloralHydrate
          min: 1
        reagent: ChloralHydrate
        amount: -10
      # Main effects
      - !type:ModifyBleed
        amount: -1.5
      - !type:EvenHealthChange
        conditions:
        - !type:MobStateCondition
          mobstate: Critical
        damage: # Doesn't heal poison because if you OD'd I'm not giving you a safety net
          Burn: -0.5
          Brute: -0.5
      - !type:HealthChange
        conditions:
        - !type:MobStateCondition
          mobstate: Critical
        damage:
          types:
            Asphyxiation: -2
      # Side effects
      - !type:ResetNarcolepsy
      - !type:ChangeNeed
        need: Hunger
        amount: 1
      - !type:ChangeNeed
        need: Thirst
        amount: 1

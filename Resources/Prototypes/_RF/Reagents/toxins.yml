- type: !PartialOnly reagent
  id: FerrochromicAcid
  metabolisms:
    Bloodstream:
      effects: !Clear
      - !type:ChangeNeed
        need: Thirst
        amount: -1.5
      - !type:HealthChange
        ignoreResistances: true
        damage:
          types:
            Heat: 2.5
            Caustic: 1

- type: reagent
  id: !PartialOnly Lipolicide
  metabolisms:
    Bloodstream:
      effects: !Clear
      - !type:HealthChange
        conditions:
        - !type:NeedCondition
          need: Hunger
          max: 50
        damage:
          types:
            Poison: 2
      - !type:ChangeNeed
        need: Hunger
        amount: -6

- type: reagent
  id: !PartialOnly ToxinTrash
  metabolisms:
    Digestion:
      effects: !Clear
      - !type:ChangeNeed
        need: Hunger
        amount: 1
        conditions:
        - !type:MetabolizerTypeCondition
          type: [Vox]

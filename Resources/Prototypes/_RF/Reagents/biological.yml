- type: reagent
  id: !PartialOnly Blood
  metabolisms:
    Digestion:
      effects: !Clear
      - !type:ChangeNeed
        need: Thirst
        amount: 1.0
        conditions:
          - !type:MetabolizerTypeCondition
            type: [ Human ]
            inverted: true
      - !type:EvenHealthChange
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Bloodsucker ]
        damage:
          Brute: -3
          Burn: -1.25

- type: reagent
  id: !PartialOnly Slime
  metabolisms:
    Digestion:
      effects: !Clear
      - !type:ChangeNeed
        need: Hunger
        amount: 1
        conditions:
        - !type:MetabolizerTypeCondition
          type: [Slime]
          inverted: true
      - !type:ModifyBloodLevel
        amount: 0.5 # drawing 15u removes 5% blood level from a slimeperson, this will add 5% when injecting 15u
        conditions:
        - !type:MetabolizerTypeCondition
          type: [Slime]

- type: reagent
  id: !PartialOnly Sap
  metabolisms:
    Digestion:
      effects: !Clear
      - !type:ChangeNeed
        need: Hunger
        amount: 1
      - !type:ChangeNeed
        need: Thirst
        amount: 1

- type: reagent
  id: !PartialOnly ZombieBlood
  metabolisms:
    Digestion:
      effects: !Clear
      - !type:ChangeNeed
        need: Thirst
        amount: -0.5

- type: reagent
  id: !PartialOnly Romerodone
  metabolisms:
    Digestion:
      effects:
      - !type:ChangeNeed
        need: Thirst
        amount: -0.5

- type: reagent
  id: !PartialOnly Ichor
  metabolisms:
    Bloodstream:
      effects: !Clear
      - !type:ChangeNeed
        need: Thirst
        amount: 1.5
    # Dragon doesn't require airloss healing, so omnizine is still best for humans.
      - !type:ModifyBloodLevel
        amount: 3
      - !type:EvenHealthChange
        damage:
          Burn: -3
          Brute: -3
          Toxin: -2
      - !type:HealthChange
        damage:
          types:
            Bloodloss: -3
      - !type:ModifyBleed
        amount: -1.5

- type: reagent
  id: !PartialOnly Vomit
  metabolisms:
    Digestion:
      effects: !Clear
      - !type:ChangeNeed
        need: Thirst
        amount: 0.5

- type: reagent
  id: !PartialOnly GreyMatter
  metabolisms:
    Digestion:
      effects: !Clear
      - !type:ChangeNeed
        need: Hunger
        amount: 1.5
      - !type:HealthChange
        damage:
          types:
            Cellular: 2

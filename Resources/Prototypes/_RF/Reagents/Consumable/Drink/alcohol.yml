
# Base Alcohol

- type: reagent
  id: !PartialOnly PoisonWine
  metabolisms:
    Digestion:
      effects: !Clear
      - !type:ChangeNeed
        need: Thirst
        amount: 2
      - !type:HealthChange
        damage:
          types:
            Poison: 1

- type: reagent
  id: !PartialOnly Champagne
  metabolisms:
    Digestion:
      effects: !Clear
      - !type:ChangeNeed
        need: Thirst
        amount: 3

# Mixed Alcohol

- type: reagent
  id: !PartialOnly DoctorsDelight
  metabolisms:
    Digestion:
      effects: !Clear
      - !type:ChangeNeed
        need: Thirst
        amount: 2
      - !type:ChangeNeed
        need: Hunger
        amount: -2
      - !type:EvenHealthChange
        damage:
          Burn: -1
          Brute: -1
          Airloss: -1
          Toxin: -1

- type: reagent
  id: !PartialOnly CogChamp

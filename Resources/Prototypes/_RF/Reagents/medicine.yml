      effects: !Clear
      - !type:ChangeNeed
        need: Thirst
        amount: 3
      - !type:HealthChange
        conditions:
        damage:
          types:
            Blunt: -0.2
            Poison: -0.2
            Heat: -0.2
            Shock: -0.2
            Cold: -0.2

- type: reagent
  id: !PartialOnly Kelotane
  metabolisms:
    Bloodstream:
      effects: !Clear
      - !type:HealthChange
        damage:
          types:
            Heat: -0.33
            Shock: -0.33
            Cold: -0.33
      - !type:ChangeNeed
        need: Thirst
        amount: -10
        conditions:
        - !type:ReagentCondition
          reagent: Kelotane
          min: 30
      - !type:PopupMessage
        type: Local
        messages:
        - generic-reagent-effect-nauseous
        - generic-reagent-effect-thirsty
        - generic-reagent-effect-parched
        probability: 0.1
        conditions:
        - !type:ReagentCondition
          reagent: Kelotane
          min: 25

- type: reagent
  id: !PartialOnly Saline
  metabolisms:
    Bloodstream:
      effects: !Clear
      - !type:ChangeNeed
        need: Thirst
        amount: 6
      - !type:ModifyBloodLevel
        amount: 6

- type: reagent
  id: !PartialOnly Lipozine
  metabolisms:
    Bloodstream:
      effects:
      - !type:ChangeNeed
        need: Hunger
        amount: -1

- type: reagent
  id: !PartialOnly Bruizine
  metabolisms:
    Bloodstream:
      effects: !Clear
      - !type:HealthChange
        damage:
          types:
            Blunt: -2.25 # 9 per u
      - !type:ChangeNeed
        need: Hunger
        amount: -1
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Bruizine
          min: 10.5
        damage:
          types:
            Poison: 2.5 # 10 per u

- type: reagent
  id: !PartialOnly Holywater
  metabolisms:

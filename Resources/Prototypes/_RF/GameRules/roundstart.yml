- type: entity
  id: PopsComponentsOverride
  categories: [ HideSpawnMenu ]
  components:
  - type: Goap
    rootTask: Idle
  - type: UtilityAi
    goals:
    - Idle
    - Sleep
    - Eat
    - Drink
    - Construction
    - Dig
    - TakeOwnership
  - type: NpcFactionMember
    factions:
    - RimFortress
  - type: NpcJobSettings
  - type: ControllableNpc
    goals:
    - MoveTo
    - Attack
    - PickUp
    - TakeOwnership
    - Pry
    - Construction
    - Deconstruct
    - Dig
    - Interact
    #- Heal
    - Chop
    #- Cook
    - InventoryStorage
    - Drop
  - type: FogOfWarClearer
  - type: NotifyOnStateChanged
    notifications:
      Critical: ColonistCriticalEvent
      Dead: ColonistDeathEvent
  - type: NotifyOnGoalGiven
    #notifications:
    #  MentalBreakdown: MentalBreakdown
    #  LeaveSettlement: LeaveSettlement

- type: entity
  id: RimFortress
  parent: BaseGameRule
  components:
  - type: RimFortressRule
    biome: RfContinental
    defaultPopsJob: Passenger
    worldEvents: !type:NestedSelector
      tableId: BasicWorldRulesTable
    globalEvents: !type:NestedSelector
      tableId: BasicGlobalRulesTable
    narrator: Basic
    dayDuration: 1800 #30 min
    popsComponentsOverride: PopsComponentsOverride

- type: entityTable
  id: BasicWorldRulesTable
  table: !type:AllSelector
    children:
    - id: PopMigration

    # Animal migration
    # Neutral
    - id: CatMigration
    - id: PossumMigration
    - id: FoxMigration
    - id: CrabMigration
    - id: GoatMigration
    - id: CowMigration
    - id: FerretMigration
    - id: FrogMigration
    - id: FrogMigration
    - id: GooseMigration
    - id: HamsterMigration
    - id: KangarooMigration
    - id: MonkeyMigration
    - id: MothroachMigration
    - id: ParrotMigration
    - id: RaccoonMigration
    - id: SnakeMigration
    # Hostile
    - id: SlimeMigration
    - id: SpiderMigration
    - id: OreCrabMigration

    # Raids
    - id: Raid

    # Mood events
    - id: SettlementInspirationEvent
    - id: SettlementDespairEvent

- type: entityTable
  id: BasicGlobalRulesTable
  table: !type:AllSelector
    children:
    - id: WarmTemperatureEvent
    - id: HotTemperatureEvent
    - id: ColdTemperatureEvent

- type: entity
  id: BaseWorldRule
  abstract: true
  components:
  - type: WorldRule

- type: entity
  id: BaseGlobalWorldRule
  parent: BaseGameRule
  abstract: true
  components:
  - type: GlobalWorldRule

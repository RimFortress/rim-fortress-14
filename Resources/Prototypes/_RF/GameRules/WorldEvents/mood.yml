- type: entity
  id: BaseMoodRule
  parent: BaseWorldRule
  abstract: true
  components:
  - type: WorldRule
    startOffset: 5m
    cost: 50
  - type: ChangeMoodRule

- type: entity
  id: SettlementInspirationEvent
  parent: BaseMoodRule
  categories: [ HideSpawnMenu ]
  components:
  - type: ChangeMoodRule
    effects:
    - MoodSettlementInspiration
    removeEffects:
    - MoodSettlementDespair
  - type: NotificationRule
    proto: SettlementInspirationEvent

- type: entity
  id: SettlementDespairEvent
  parent: BaseMoodRule
  categories: [ HideSpawnMenu ]
  components:
  - type: ChangeMoodRule
    effects:
    - MoodSettlementDespair
    removeEffects:
    - MoodSettlementInspiration
  - type: NotificationRule
    proto: SettlementDespairEvent

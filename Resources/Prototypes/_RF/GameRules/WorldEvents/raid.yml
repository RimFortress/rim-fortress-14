# Raids
- type: entity
  id: Raid
  parent: BaseScriptedWorldRule
  categories: [ HideSpawnMenu ]
  components:
  - type: WorldRule
    startOffset: 15m
    cost: 75
  - type: MigrationRule
    spawn:
      Raider: 45
  - type: NotificationRule
    proto: Raid
  - type: MathVariables
    variables:
      kills: [float: 0]
      losses: [float: 0]
      raidersTotal: [float: 0]
      # How strong the residents and the raiders are, see EntityPowerSystem, and how the raiders are split into squads. A squad has to
      # be at least squadPowerRatio of the power of the residents, so a force that is not stronger than that is one squad, and the
      # stronger it is the more squads there are, up to maxSquads of the PlanSquads.
      targetPower: [float: 0]
      raidPower: [float: 0]
      squadPowerRatio: [float: 0.6]
      # The stance of a squad: it holds if it is weaker than holdRatio of the power of the residents, and rushes if it is stronger
      # than rushRatio of it, otherwise it keeps together, see the goals of the raiders.
      holdRatio: [float: 0.5]
      rushRatio: [float: 1.5]
      planning: [float: 0]
      # The morale of the raiders is how many of them are alive, plus what the kills add to it, minus what the time without
      # kills takes away. When it falls below retreatMorale the raiders retreat.
      moraleKillBonus: [float: 0.5]
      stalemateTime: [float: 600]
      retreatMorale: [float: 0.3]
      # For how long they retreat, until those who are left are gone.
      retreatDuration: [float: 180]
  - type: Phases
    phases:
      Assault:
        tick:
        - !type:SetPhase
          phase: Retreat
          conditions:
          - !type:MathCurveCondition
            curves:
            - var: morale
            - minus: [var: retreatMorale]
            - !type:Threshold
              lessThan: 0
      Retreat:
        enter:
        - !type:ApplyToEngagementActors
          engagement: Raid
          role: Raider
          effects:
          - !type:SetGoapFlag
            key: Retreating
        # They leave the way that is the cheapest, round the settlements, and are gone where nobody observes them.
        tick:
        - !type:ApplyToEngagementActors
          engagement: Raid
          role: Raider
          effects:
          - !type:DespawnEntity
            conditions:
            - !type:Unobserved
        # Those who cannot leave in time are gone with the end of the raid.
        - !type:EndWorldRule
          result: Failed
          conditions:
          - !type:MathCurveCondition
            curves:
            - !type:CurTimeSeconds
            - minus: [var: phaseStartedAt]
            - minus: [var: retreatDuration]
            - !type:Threshold
              moreThan: 0
  - type: KeyedEntityEffectOnTrigger
    effects:
      started:
      # What the raid is about is kept here once, the raiders read it from the raid, see Engagement/Raid/Owner/...
      - !type:CopySettlementResidents
      - !type:SetSettlementTarget
      - !type:SetMathVariable
        key: startedAt
        value:
        - !type:CurTimeSeconds
      - !type:SetMathVariable
        key: lastKillAt
        value:
        - !type:CurTimeSeconds
      - !type:SetMathVariable
        key: targetsTotal
        value:
        - !type:SearchQueryCount
          query: RaidTargets
      - !type:SetMathVariable
        key: targetPower
        value:
        - !type:ForEachEntity
          key: Query/RaidTargetsAlive/All
          curves:
          - add:
            - !type:PrototypeCurve
              preset: FighterPower
      - !type:SetPhase
        phase: Assault
      # Every raider joins the raid, and its squad is made when all of them are there.
      spawned:
      - !type:SetMathVariable
        key: raidersTotal
        value:
        - add: [float: 1]
      - !type:JoinEngagement
        engagement: Raid
        roles: [Raider]
      spawned.all:
      - !type:PlanSquads
        source: Raid
        sourceRole: Raider
        squad: RaidSquad
        maxSquads: 4
        power:
        - !type:PrototypeCurve
          preset: FighterPower
        minPower:
        - var: targetPower
        - mul: [var: squadPowerRatio]
      - !type:MeasureSquads
        squad: RaidSquad
        power:
        - !type:PrototypeCurve
          preset: FighterPower
        threat:
        - var: targetPower
        stance:
        - var: ratio
        - minus: [var: holdRatio]
        - !type:Threshold
          moreThan: 0
        - add:
          - var: ratio
          - minus: [var: rushRatio]
          - !type:Threshold
            moreThan: 0
      - !type:AssignSquadTargets
        squad: RaidSquad
        targets: Query/RaidTargetsAlive/All
        power:
        - !type:PrototypeCurve
          preset: FighterPower
        # The target goes to the squad that it costs the least: the closer, the cheaper, the more the squad has got for its
        # strength, the dearer, and what is already the squad's is cheaper by a fifth, so they are not passed over little things.
        cost:
        - var: distance
        - mul:
          - float: 1
          - add:
            - var: load
            - div: [var: capacity]
        - mul:
          - float: 1
          - minus:
            - var: current
            - mul: [float: 0.2]
      tick:
      - !type:SetMathVariable
        key: targetPower
        value:
        - !type:ForEachEntity
          key: Query/RaidTargetsAlive/All
          curves:
          - add:
            - !type:PrototypeCurve
              preset: FighterPower
      - !type:SetMathVariable
        key: raidPower
        value:
        - !type:ForEachEntity
          key: OwnedEngagement/Raid/Role/Raider/All
          curves:
          - add:
            - !type:PrototypeCurve
              preset: FighterPower
      # The squads are made again when the force has changed so that they are not what they should be: the weaker it is the fewer
      # squads there are, and a squad that has lost its strength joins the others.
      - !type:PlanSquads
        source: Raid
        sourceRole: Raider
        squad: RaidSquad
        maxSquads: 4
        power:
        - !type:PrototypeCurve
          preset: FighterPower
        minPower:
        - var: targetPower
        - mul: [var: squadPowerRatio]
      - !type:MeasureSquads
        squad: RaidSquad
        power:
        - !type:PrototypeCurve
          preset: FighterPower
        threat:
        - var: targetPower
        stance:
        - var: ratio
        - minus: [var: holdRatio]
        - !type:Threshold
          moreThan: 0
        - add:
          - var: ratio
          - minus: [var: rushRatio]
          - !type:Threshold
            moreThan: 0
      - !type:AssignSquadTargets
        squad: RaidSquad
        targets: Query/RaidTargetsAlive/All
        power:
        - !type:PrototypeCurve
          preset: FighterPower
        # The target goes to the squad that it costs the least: the closer, the cheaper, the more the squad has got for its
        # strength, the dearer, and what is already the squad's is cheaper by a fifth, so they are not passed over little things.
        cost:
        - var: distance
        - mul:
          - float: 1
          - add:
            - var: load
            - div: [var: capacity]
        - mul:
          - float: 1
          - minus:
            - var: current
            - mul: [float: 0.2]
      - !type:SetMathVariable
        key: deadFraction
        value:
        - !type:SearchQueryCount
          query: RaidTargetsDead
        - div: [var: targetsTotal]
      - !type:SetMathVariable
        key: raiders
        value:
        - !type:EngagementActors
          engagement: Raid
          role: Raider
      - !type:SetMathVariable
        key: sinceLastKill
        value:
        - !type:CurTimeSeconds
        - minus: [var: lastKillAt]
      - !type:SetMathVariable
        key: aliveFraction
        value:
        - var: raiders
        - div: [var: raidersTotal]
      - !type:SetMathVariable
        key: pressure
        value:
        - var: sinceLastKill
        - div: [var: stalemateTime]
      - !type:SetMathVariable
        key: morale
        value:
        - var: deadFraction
        - mul: [var: moraleKillBonus]
        - add: [var: aliveFraction]
        - minus: [var: pressure]
      # The settlement is destroyed when most of its residents are dead.
      - !type:EndWorldRule
        result: Won
        conditions:
        - !type:MathCurveCondition
          curves:
          - var: deadFraction
          - !type:Threshold
            moreThan: 0.8
      # The raid is lost if the raiders are all dead. If they cannot kill anyone for a long time their morale falls and they retreat.
      - !type:EndWorldRule
        result: Failed
        conditions:
        - !type:MathCurveCondition
          curves:
          - var: raiders
          - !type:Threshold
            lessThan: 1
      RaidTargetsDead.added:
      - !type:SetMathVariable
        key: kills
        value:
        - add: [float: 1]
      - !type:SetMathVariable
        key: lastKillAt
        value:
        - !type:CurTimeSeconds
      # A squad that has lost its leader gets a new one from the members.
      RaidSquad.left.SquadLeader:
      - !type:PromoteEngagementActor
        engagement: RaidSquad
        role: SquadLeader
        rank:
        - !type:PrototypeCurve
          preset: FighterPower
        conditions:
        - !type:MathCurveCondition
          curves:
          - var: planning
          - !type:Threshold
            lessThan: 0.5
      Raid.left.Raider:
      - !type:SetMathVariable
        key: losses
        value:
        - add: [float: 1]
      # Whoever is left when the raid is over is gone.
      ended:
      - !type:ApplyToEngagementActors
        engagement: Raid
        role: Raider
        effects:
        - !type:DespawnEntity

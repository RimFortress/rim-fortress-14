# Raids
- type: entity
  id: Raid
  parent: BaseScriptedWorldRule
  categories: [ HideSpawnMenu ]
  components:
  - type: WorldRule
    startOffset: 15m
    cost: 75
  - type: MigrationRule
    spawn:
      Raider: 45
  - type: NotificationRule
    proto: Raid
  - type: MathVariables
    variables:
      kills: [float: 0]
      losses: [float: 0]
      raidersTotal: [float: 0]
      # How strong the residents and the raiders are, see EntityPowerSystem, and how the raiders are split into squads. A squad has to
      # be at least squadPowerRatio of the power of the residents, so a force that is not stronger than that is one squad, and the
      # stronger it is the more squads there are, up to maxGroups of the FormGroups, when the raid has just come. After that the squads
      # are only joined, see MergeGroups.
      targetPower: [float: 0]
      raidPower: [float: 0]
      squadPowerRatio: [float: 0.6]
      # The stance of a squad: it holds if it is weaker than holdRatio of the power of the residents, and rushes if it is stronger
      # than rushRatio of it, otherwise it keeps together, see the goals of the raiders.
      holdRatio: [float: 0.5]
      rushRatio: [float: 1.5]
      # A squad that is weaker than mergeFraction of that joins another one, if it stays so for long enough and one is near.
      mergeFraction: [float: 0.5]
      # The morale of the raiders is how many of them are alive, plus what the kills add to it, minus what the time without
      # kills takes away. When it falls below retreatMorale the raiders retreat.
      moraleKillBonus: [float: 0.5]
      stalemateTime: [float: 600]
      retreatMorale: [float: 0.3]
      # For how long they retreat, until those who are left are gone.
      retreatDuration: [float: 180]
      # For how long the raiders that have won leave, until those who are left are gone: they walk away to where nobody sees them.
      withdrawDuration: [float: 240]
      # What the phases look at, before the first measurement is made.
      deadFraction: [float: 0]
      morale: [float: 1]
      raiders: [float: 1]
  - type: Phases
    phases:
      # The raiders come to the settlement and fight. The raid is won when most of the residents are dead, and then the raiders leave,
      # it is lost when the raiders are all dead, and when they lose heart they retreat.
      Assault:
        tick:
        - !type:SetPhase
          phase: Withdraw
          conditions:
          - !type:MathCurveCondition
            curves:
            - var: deadFraction
            - !type:Threshold
              moreThan: 0.8
        - !type:SetPhase
          phase: Retreat
          conditions:
          - !type:MathCurveCondition
            curves:
            - var: morale
            - minus: [var: retreatMorale]
            - !type:Threshold
              lessThan: 0
        - !type:EndWorldRule
          result: Failed
          conditions:
          - !type:MathCurveCondition
            curves:
            - var: raiders
            - !type:Threshold
              lessThan: 1
      # The raiders have lost heart and run. They leave the way that is the cheapest, round the settlements, and are gone where nobody
      # observes them. The raid is lost when they are all gone, or when they have not got away in time.
      Retreat:
        enter:
        - !type:ApplyToEngagementActors
          engagement: RaidForce
          role: Raider
          effects:
          - !type:SetGoapFlag
            key: Retreating
        tick:
        - !type:ApplyToEngagementActors
          engagement: RaidForce
          role: Raider
          effects:
          - !type:DespawnEntity
            conditions:
            - !type:Unobserved
        - !type:SetPhase
          phase: Withdraw
          conditions:
          - !type:MathCurveCondition
            curves:
            - var: deadFraction
            - !type:Threshold
              moreThan: 0.8
        - !type:EndWorldRule
          result: Failed
          conditions:
          - !type:MathCurveCondition
            curves:
            - var: raiders
            - !type:Threshold
              lessThan: 1
        # Those who cannot leave in time are gone with the end of the raid.
        - !type:EndWorldRule
          result: Failed
          conditions:
          - !type:MathCurveCondition
            curves:
            - !type:CurTimeSeconds
            - minus: [var: phaseStartedAt]
            - minus: [var: retreatDuration]
            - !type:Threshold
              moreThan: 0
      # The raid has won. The raiders leave the same way as when they retreat, and are not seen to vanish: each is gone only where
      # nobody observes it. The raid is over when they are all gone, or when they have not got away in time.
      Withdraw:
        enter:
        - !type:ApplyToEngagementActors
          engagement: RaidForce
          role: Raider
          effects:
          - !type:SetGoapFlag
            key: Retreating
        tick:
        - !type:ApplyToEngagementActors
          engagement: RaidForce
          role: Raider
          effects:
          - !type:DespawnEntity
            conditions:
            - !type:Unobserved
        - !type:EndWorldRule
          result: Won
          conditions:
          - !type:MathCurveCondition
            curves:
            - var: raiders
            - !type:Threshold
              lessThan: 1
        # Those who cannot leave in time, such as the ones that are down, are gone with the end of the raid.
        - !type:EndWorldRule
          result: Won
          conditions:
          - !type:MathCurveCondition
            curves:
            - !type:CurTimeSeconds
            - minus: [var: phaseStartedAt]
            - minus: [var: withdrawDuration]
            - !type:Threshold
              moreThan: 0
  - type: KeyedEntityEffectOnTrigger
    effects:
      started:
      # What the raid is about is kept here once, the raiders read it from the raid, see Engagement/RaidForce/Owner/...
      - !type:CopySettlementResidents
      - !type:SetSettlementTarget
      - !type:SetMathVariable
        key: startedAt
        value:
        - !type:CurTimeSeconds
      - !type:SetMathVariable
        key: lastKillAt
        value:
        - !type:CurTimeSeconds
      - !type:SetMathVariable
        key: targetsTotal
        value:
        - !type:SearchQueryCount
          query: RaidTargets
      - !type:SetMathVariable
        key: targetPower
        value:
        - !type:ForEachEntity
          key: Query/RaidTargetsAlive/All
          curves:
          - add:
            - !type:PrototypeCurve
              preset: FighterPower
      - !type:SetPhase
        phase: Assault
      # Every raider joins the raid, and its squad is made when all of them are there.
      spawned:
      - !type:SetMathVariable
        key: raidersTotal
        value:
        - add: [float: 1]
      # The raid owns the raiders and everything they carry, so they share the equipment: what one has, the others find.
      - !type:OwnUser
      - !type:PlaceInGroup
        group: RaidForce
        roles: [Raider]
      tick:
      - !type:SetMathVariable
        key: targetPower
        value:
        - !type:ForEachEntity
          key: Query/RaidTargetsAlive/All
          curves:
          - add:
            - !type:PrototypeCurve
              preset: FighterPower
      - !type:SetMathVariable
        key: raidPower
        value:
        - !type:ForEachEntity
          key: OwnedEngagement/RaidForce/Role/Raider/All
          curves:
          - add:
            - !type:PrototypeCurve
              preset: FighterPower
      # The raiders are split into squads once, a little after they have come, and later the squads are only joined, see MergeGroups.
      - !type:FormGroups
        onlyIfNone: true
        source: RaidForce
        sourceRole: Raider
        group: RaidSquad
        maxGroups: 4
        power:
        - !type:PrototypeCurve
          preset: FighterPower
        minPower:
        - var: targetPower
        - mul: [var: squadPowerRatio]
      - !type:MeasureGroups
        group: RaidSquad
        power:
        - !type:PrototypeCurve
          preset: FighterPower
        threat:
        - var: targetPower
        stance:
        - var: ratio
        - minus: [var: holdRatio]
        - !type:Threshold
          moreThan: 0
        - add:
          - var: ratio
          - minus: [var: rushRatio]
          - !type:Threshold
            moreThan: 0
      # A squad that has been too weak for a while joins the closest squad, if it is near. The other squads stay as they are.
      - !type:MergeGroups
        group: RaidSquad
        delay: 10
        maxDistance: 30
        weak:
        - var: power
        - minus:
          - var: targetPower
          - mul: [var: squadPowerRatio]
          - mul: [var: mergeFraction]
        - !type:Threshold
          lessThan: 0
      - !type:AssignGroupTargets
        group: RaidSquad
        targets: Query/RaidTargetsAlive/All
        power:
        - !type:PrototypeCurve
          preset: FighterPower
        # The target that nobody has goes to the squad that it costs the least: the closer, the cheaper, the more the squad has got for
        # its strength, the dearer.
        cost:
        - var: distance
        - mul:
          - float: 1
          - add:
            - var: load
            - div: [var: capacity]
      - !type:SetMathVariable
        key: deadFraction
        value:
        - !type:SearchQueryCount
          query: RaidTargetsDead
        - div: [var: targetsTotal]
      - !type:SetMathVariable
        key: raiders
        value:
        # Those who can fight: the ones that are down are in the raid, but they are not in the formation, they are neither the force
        # of the raid nor the morale of it.
        - !type:EngagementActors
          engagement: RaidForce
          role: Raider
          conditions:
          - !type:MobState
            targetState: Alive
      - !type:SetMathVariable
        key: sinceLastKill
        value:
        - !type:CurTimeSeconds
        - minus: [var: lastKillAt]
      - !type:SetMathVariable
        key: aliveFraction
        value:
        - var: raiders
        - div: [var: raidersTotal]
      - !type:SetMathVariable
        key: pressure
        value:
        - var: sinceLastKill
        - div: [var: stalemateTime]
      - !type:SetMathVariable
        key: morale
        value:
        - var: deadFraction
        - mul: [var: moraleKillBonus]
        - add: [var: aliveFraction]
        - minus: [var: pressure]
      RaidTargetsDead.added:
      - !type:SetMathVariable
        key: kills
        value:
        - add: [float: 1]
      - !type:SetMathVariable
        key: lastKillAt
        value:
        - !type:CurTimeSeconds
      # A squad that has lost its leader gets a new one from the members.
      RaidSquad.left.SquadLeader:
      - !type:FillGroupRole
        group: RaidSquad
        role: SquadLeader
        rank:
        - !type:PrototypeCurve
          preset: FighterPower
      RaidForce.left.Raider:
      - !type:SetMathVariable
        key: losses
        value:
        - add: [float: 1]
      # Whoever is able to fight and is left when the raid is over is gone. The ones that are down are left where they lie.
      ended:
      - !type:ApplyToEngagementActors
        engagement: RaidForce
        role: Raider
        effects:
        - !type:DespawnEntity
          conditions:
          - !type:MobStateCondition
            mobstate: Alive

- type: entity
  id: BaseMigrationRule
  parent: BaseWorldRule
  abstract: true
  components:
    - type: WorldRule
      startOffset: 300 #5 min
      cost: 30
    - type: MigrationRule

- type: entity
  id: RareMigrationRule
  parent: BaseMigrationRule
  abstract: true
  components:
    - type: WorldRule
      startOffset: 600 #5 min
      cost: 50

- type: entity
  id: GrasslandMigrationRule
  parent: BaseMigrationRule
  abstract: true
  components:
    - type: WorldRule
      startOffset: 300 #5 min
      requiredBiomes:
        - RfGrassland
      cost: 30

- type: entity
  id: DesertMigrationRule
  parent: BaseMigrationRule
  abstract: true
  components:
    - type: WorldRule
      startOffset: 300 #5 min
      requiredBiomes:
        - RfLowDesert
      cost: 30

- type: entity
  id: PopMigration
  parent: BaseMigrationRule
  categories: [ HideSpawnMenu ]
  components:
  - type: WorldRule
    startOffset: 600 #10 min
    cost: 100
  - type: MigrationRule
    spawn:
      RimFortressMobPop: 100
    addToPops: true
  - type: NotificationRule
    proto: PopMigration


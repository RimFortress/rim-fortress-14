- type: entity
  id: RimFortressMobPop
  parent: [ MobHuman, PopsComponentsOverride ]
  save: false
  components:
  - type: RandomHumanoidAppearance
    randomizeName: false
  - type: RandomMetadata
    nameSegments:
    - NamesFirst
    - NamesLast
  - type: Loadout
    prototypes:
    - RfSafariGear
    - RfMercenaryGear
    - RfCossacGear
    - RfRandomVisualGear
  - type: InputMover
  - type: MobMover

- type: entity
  id: Raider
  parent: MobHuman
  save: false
  components:
    - type: RandomHumanoidAppearance
      randomizeName: false
    - type: RandomMetadata
      nameSegments:
        - NamesFirst
        - NamesLast
    - type: Loadout
      prototypes:
        - SafariRaid1Gear
        - SafariRaid2Gear
        - SafariRaid3Gear
        - SafariRaid4Gear
        - RandomVisualRaid1Gear
        - RandomVisualRaid2Gear
        - RandomVisualRaid3Gear
        - RandomVisualRaid4Gear
    - type: InputMover
    - type: MobMover
    - type: HTN
      rootTask:
        task: IdleCompound
    - type: NpcFactionMember
      factions:
        - Raiders
    - type: ControllableNpc

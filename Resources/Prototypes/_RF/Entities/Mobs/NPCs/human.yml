- type: entity
  id: RimFortressMobPop
  parent: [ MobHuman, PopsComponentsOverride ]
  save: false
  components:
  - type: RandomHumanoidAppearance
    randomizeName: false
  - type: RandomMetadata
    nameSegments:
    - NamesFirst
    - NamesLast
  - type: Loadout
    prototypes:
    - RfSafariGear
    - RfMercenaryGear
    - RfCossacGear
    - RfRandomVisualGear
  - type: InputMover
  - type: MobMover

- type: entity
  id: Raider
  parent: MobHuman
  save: false
  components:
  - type: RandomHumanoidAppearance
    randomizeName: false
  - type: RandomMetadata
    nameSegments:
    - NamesFirst
    - NamesLast
  - type: Loadout
    prototypes:
    - SafariRaid1Gear
    - SafariRaid2Gear
    - SafariRaid3Gear
    - SafariRaid4Gear
    - RandomVisualRaid1Gear
    - RandomVisualRaid2Gear
    - RandomVisualRaid3Gear
    - RandomVisualRaid4Gear
  - type: InputMover
  - type: MobMover
  - type: CombatMode
    isInCombatMode: true
  - type: Goap
    rootTask: RaiderIdle
    state:
      Retreating: false
      # How far a raider looks for the way out when it retreats.
      RetreatRange: 150.0
  - type: PathProfiles
    profiles:
    - Walker
  - type: UtilityAi
    goals:
    - RaiderAttack
    - RaiderAdvance
    - RaiderRetreat
  - type: NpcFactionMember
    factions:
    - Raiders

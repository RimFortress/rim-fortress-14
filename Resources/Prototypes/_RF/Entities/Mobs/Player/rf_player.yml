- type: entity
  parent: [ Incorporeal, BaseMob ]
  id: RimFortressObserver
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Mobs/Ghosts/ghost_human.rsi
    color: "#FFFFFF00"
    visible: false
    noRot: true
    layers:
    - state: animated
      shader: unshaded
  - type: ContentEye
    maxZoom: 6,6
  - type: Eye
    drawFov: false
    pvsScale: 0.1
  - type: Input
    context: "ghost"
  - type: Examiner
    skipChecks: true
  - type: Ghost
    canInteract: true
  - type: GhostHearing
  - type: IntrinsicRadioReceiver
  - type: ActiveRadio
    receiveAllChannels: true
    globalReceive: true
  - type: MovementSpeedModifier
    baseWalkSpeed: 13
    baseSprintSpeed: 20
  - type: Tag
    tags:
    - BypassInteractionRangeChecks
  - type: ComplexInteraction
  - type: NoRotateOnInteract
  - type: NoRotateOnMove
  - type: MouseDragMove
  - type: NpcController
    goals:
    - MoveTo
    - Attack
    - PickUp
    - TakeOwnership
    - Pry
    - Construction
    - Deconstruct
    - Dig
    - Interact
    #- Heal
    - Chop
    #- Cook
    - InventoryStorage
    - Drop
  - type: NpcJobs
    jobs:
    - name: npc-job-construction-name
      icon: /Textures/_RF/Interface/hammer-solid.svg.192dpi.png
      goals:
      - Construction
      - Deconstruct
    - name: npc-job-mining-name
      icon: /Textures/_RF/Interface/VerbIcons/person-digging-solid.svg.192dpi.png
      goals:
      - Dig
  - type: NpcFactionMember
    factions:
    - RimFortress
  - type: Notification

- type: entity
  id: Stockpile
  name: Stockpile
  description: A storage zone for various items. The list of items to be stored can be customized in the settings.
  components:
  - type: Zone
    icon: _RF/Interface/cubes-solid.svg.192dpi.png
    collisionMode: Tile
    collisionWhitelist:
      components:
      - Item
      - Pullable
      requireAll: false
    conditions:
      TileAdd:
      - !type:Blocked
        invert: true
      - !type:InZone
        types:
        - Stockpile
        validOnly: true
        invert: true
      - !type:TileEntities
        types:
        - FloorWaterEntity
        - FloorLavaEntity
        - FloorLiquidPlasmaEntity
        - FloorChasmEntity
        invert: true
  - type: ZoneVisuals
    editable: true
    tileSprite: _RF/Tiles/Zones/stockpile.png
    selectedTileSprite: _RF/Tiles/Zones/stockpile_selected.png
    borderColor: darkOrange
  - type: Stockpile
  - type: Physics
  - type: Fixtures

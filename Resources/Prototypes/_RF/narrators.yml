- type: narrator
  id: Basic
  # What the categories of the wealth of a settlement count for (see the settlement): the buildings are worth half of what they cost.
  wealthWeights:
    Construction:
    - mul:
      - float: 0.5
  eventWaitFactor: 0.016 # ~1 point per minute
  wealthCurves:
  - moreThan: 40000
    value:
    - add:
      - float: 10000
  # 19999 => 0
  - lessThan: 2000
    value:
    - mul:
      - float: 0
  # 20000 => 100
  - moreThan: 20000
    lessThan: 40000
    value:
    - mul:
      - float: 0.005
  # 90000 => 400
  - moreThan: 40000
    value:
    - mul:
      - float: 0.004
  - clamp:
      max: 400
  # +0.24 per 10 minutes
  moodCurves:
  - float: 1
  - add:
    - !type:RoundTimeSeconds
    - mul:
      - float: 0.0004
  # |points / 20 * sin(points)|
  eventChanceCurves:
  - !type:Sin
  - mul:
    - float: 1
    - add:
      - !type:RoundTimeSeconds
      - mul:
        - float: 0.0004
    - mul:
      - float: 0.05
  - !type:Abs
  - clamp:
      max: 1

- type: narrator
  id: Random
  wealthWeights:
    Construction:
    - mul:
      - float: 1
  eventWaitFactor: 0.016 # ~1 point per minute
  wealthCurves:
  - lessThan: 20000
    value:
    - mul:
      - float: 0
  - mul:
    - float: 0.005 # 20000 => 100
  - mul:
    - random:
        max: 2
  moodCurves:
  - random:
      max: 10
  # Absolute random
  eventChanceCurves:
  - random:
      max: 1

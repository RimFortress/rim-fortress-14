# Delay: the attack rate (attacks per second) grows by 0.02 for each level above the difficulty of the weapon.
# Result: the damage grows by 10% for each level above and falls by as much for each level below, but not below 10%.
- type: skillCheck
  id: MeleeStrikeBase
  parent: BaseSkillCheck
  abstract: true
  difficulty:
  - var: usedDifficulty
  delay:
  - add:
    - var: delta
    - mul: [float: 0.02]
  - clamp:
      min: 0.1
      max: 100
  result:
  - add:
    - var: delta
    - mul: [float: 0.1]
  - clamp:
      min: 0.1
      max: 10
  experience:
    Fail:
    - var: difficulty
    - mul: [float: 1.25]
    Success:
    - var: difficulty
    - mul: [float: 2.5]
    AdditionalSuccess:
    - var: difficulty
    - mul: [float: 5]

# Any hit of a weapon that has its difficulty, if there is no better check for it.
# With a good hit the weapon is ready to hit again at once, with a bad one the user hurts themselves.
- type: skillCheck
  id: MeleeStrike
  parent: MeleeStrikeBase
  effects:
    Used:
      AdditionalSuccess:
      - !type:ResetMeleeCooldown
        probability: 0.5
    User:
      Fail:
      - !type:SelfAttack
        probability: 0.1


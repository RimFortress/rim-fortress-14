# The difficulty is the one of the workshop and the one of the recipe together, see recipeDifficulty in WorkshopSystem.
# Delay: each level above the difficulty takes two seconds off the crafting, but not below 0.15.
# A spoilt dish gives no experience.
- type: skillCheck
  id: Cooking
  parent: BaseSkillCheck
  difficulty:
  - var: usedDifficulty
  - add: [var: recipeDifficulty]
  delay:
  - minus:
    - var: delta
    - mul: [float: 2]
  - clamp:
      min: 0.15
      max: 3600
  experience:
    Success:
    - var: difficulty
    - mul: [float: 2.5]
    AdditionalSuccess:
    - var: difficulty
    - mul: [float: 5]

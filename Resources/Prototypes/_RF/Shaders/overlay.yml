- type: shader
  id: DottedCircle
  kind: source
  path: "/Textures/_RF/Shaders/dotted_circle.swsl"
  params:
    radius: 0.35
    thickness: 0.04
    frequency: 6
    rotationSpeed: 1
    pulseSpeed: 3
    pulseAmplitude: 0.15

- type: shader
  id: DottedLine
  kind: source
  path: "/Textures/_RF/Shaders/dotted_line.swsl"
  params:
    startOffset: 0.2
    endOffset: 0.5
    thickness: 0.02
    dashLen: 10
    gapLen: 15
    scrollSpeed: 0

- type: shader
  id: AnimatedDottedLine
  kind: source
  path: "/Textures/_RF/Shaders/dotted_line.swsl"
  params:
    startOffset: 0.2
    endOffset: 0.2
    thickness: 0.03
    dashLen: 15
    gapLen: 15
    scrollSpeed: 25

- type: shader
  id: DottedOutline
  kind: source
  path: "/Textures/_RF/Shaders/dotted_outline.swsl"
  params:
    width: 2
    frequency: 10
    rotationSpeed: 1

- type: shader
  id: DottedSquareOutline
  kind: source
  path: "/Textures/_RF/Shaders/dotted_square.swsl"
  params:
    thickness: 2
    dashLength: 10
    gapLength: 10
